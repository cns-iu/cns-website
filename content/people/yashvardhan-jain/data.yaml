      joined CNS in October 2020 as a Research Assistant to work on
      diffeomorphic image registration for 3D biomedical data. In August 2021, I
      joined CNS full-time as a Research Engineer for Machine Learning to
      continue working on 3D image registration as well as deep learning for
      image segmentation and generative tasks for 2D and 3D biomedical data.
