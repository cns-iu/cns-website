    education: "BFA, Studio Art and BA, Philosophy<br/>\r\nAugustana College, Rock Island, IL (2004)"
    background: "I've been an artist my whole life, and became interested in computers at a very young age. I was pursuing a degree in studio art when I started to learn more about graphic design, and I soon discovered that my artistic ability and aptitude for computers made a great combination. \r\n<br/><br/>\r\nI started working as a freelance designer shortly after graduation as a way to diversify my skill set and earn some extra money. I've since held various print production and graphic design positions, collecting a varied set of skills over the years. I'm well-versed in digital image manipulation, having spent two years at a large-format commercial printer learning techniques from industry-leading color correction experts, and two additional years toning images for an ad agency and a national news corporation.\r\n<br /><br /> \r\n\r\nI handle all print and web design for the Center, including the ongoing design and maintenance of both the CNS and <a href=\"http://www.scimaps.org\" target=\"_blank\">Places &amp; Spaces</a> websites, website and supporting graphics for the IVMOOC course, user interface design for interactive displays, handouts, flyers, business cards, social media, and more."
    interests: >-
      I enjoy spending time with my wife and three kids, playing the guitar,
      writing music, watching movies, and being outdoors.
    dateStart: '2013-09-01'
    dateEnd: '2015-08-07'
