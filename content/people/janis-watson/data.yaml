    education: "M.S.+20 Hours in At Risk Education, Indiana University, 1986\r\n<br> \r\nM.S. in Special Education: Learning Disabilities, Indiana University  1983\r\n<br>\r\nB.S. in Elementary Education, Indiana University, 1978\r\n"
    background: "Prior to working at the CNS, Janis was a classroom teacher for twenty years, working in public education and learning disabilities in southern Indiana schools. She then moved into the private sector, writing online content for an innovative homeschool app, created teaching guides to accompany educational videos from IU’s ERIC database, and managing other writers. She left that position to take a job here at IU with Dr. Sasha Barab’s Quest Atlantis/Atlantis Remixed project, an 3D immersive, educational, role-playing video game first created here at IU in the Active Worlds platform and then rebooted into Unity when Dr. Barab moved to Arizona State University.\r\n \r\nSince 2011 Janis has been serving as the Curriculum Consultant/Specialist, copy editor, and general manager for Dr. Peppler's team here at IU, The Creativity Labs."
