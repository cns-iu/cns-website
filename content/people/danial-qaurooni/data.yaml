    education: "BSc, in Computer Engineering – Ferdowsi University, Mashad, Iran (2008)\r\nMSc, in Computer Science - Amirkabir University of Technology, Tehran, Iran (2012)\r\nPhD, Double Major in Informatics and Cognitive Science - Indiana University, Bloomington, IN (2022)"
    background: "I come from a Computer Science background but I have become increasingly interested in design research and anthropology of technology. My dissertation was an ethnographic study of the Food Computer (2015-2020), a design project at the MIT Media Lab. At CNS, my main focus will be design research re HuBMAP and the associated projects. Using a mixture of qualitative and quantitative methods, my goal is to bridge the technical with the social and generate practical insights that can inform the design process.\r\n<br><br>\r\n\r\nDanial Qaurooni's website: <a href=\"https://dequeue.cc/\" target=\"_blank\">https://dequeue.cc/</a>"
