    background: "Juhi Khare is currently a Research Assistant at the Cyberinfrastructure for Network Science Center (CNS), specializing in User Research and UX Design. Her work centers on immersive experience design, particularly in virtual reality (VR), where she applies qualitative research methods, usability testing, and interaction design to enhance biomedical data exploration tools like the HRA Organ Gallery. She recently earned a master’s degree in Human-Computer Interaction from Indiana University. Her thesis, a Research for Design project, investigated how Instagram Reels feeds shape self-perception in young females, reflecting her broader interest in the psychological and cultural implications of digital technology.\r\nPrior to joining CNS, Juhi contributed to user experience design at Salesforce, improving community engagement through refined user flows and interfaces. Among other experiences, she also worked as a full-stack developer at IIT Kanpur, designing and developing web applications from the ground up. With a background in Electronics and Telecommunication Engineering, she brings a systems-oriented approach to design, blending creativity with technical feasibility.\r\nJuhi’s transition from engineering to HCI was fueled by a deep interest in understanding not just how systems function, but how users experience them. This curiosity continues to drive her work—investigating how digital products influence behavior and how design can be used to craft more thoughtful, human-centered experiences.\r\nPortfolio: https://juhikhare.com \r\n"
    interests: >-
      Juhi enjoys participating in design hackathons to connect with industry
      professionals and values coffee chats where she learns from their diverse
      product design experiences. When not engaging with the design community,
      she likes to spend her time reading, taking long walks in nature, and
      trying new cuisines.
