    background: >-
      I am the Research Lead at CNS in the Luddy School of Informatics,
      Computing, and Engineering (Luddy SICE) at Indiana University Bloomington
      (and affiliated with the [Luddy Data Science
      Program](https://datascience.indiana.edu/)). My research interest is
      interactive information visualization in virtual reality (VR), augmented
      reality (AR), mixed reality (MR), and other technologies for extended
      reality (XR). Born and raised in Germany, I hold a B.A. in Media Studies
      from Eberhard Karls University in Tuebingen, an M.A. in Communications
      from Berlin University of the Arts, and a Ph.D. in Information Science
      from Indiana University. From early on, I developed a deep interest in
      digital artifacts, most notably videography and photography. After working
      as a video journalist and cameraman on projects in Germany, France, India,
      and the US, I decided to switch to a more technical education and got a
      Ph.D. in Information Science at Indiana University Bloomington.. <br><br>


      You can find more info about my work on my website: <a href="https://andreas-bueckle.com/" target="_blank">https://andreas-bueckle.com/</a>
