    interests: In my spare time, I enjoy the great outdoors by competing in local
      and regional sailing regattas with my 14-foot Force 5 sailboat. I am also
      the faculty advisor of the Sailing Club at Indiana University. In the
      off-season for sailing, i.e., the Indiana winter, I rock-climb in our
      local gym.
    displayOrder: 2
