    background: "I have worked for CNS since January 2010, when I started as a student research assistant. Now as a full-time member of the CNS team,  I test and document the network analysis and visualization software created by our center. I write and edit software tutorials that are widely accessible and teach users, through hands-on workshops, how to incorporate our tools into their own research. I work mainly with the Science of Science (Sci2) Tool, answering user questions, providing technical support, and consulting on research projects. \r\n<br /><br /> \r\nIn addtion to my work with Sci2, I am endeavoring to get the Maps of Science in map libraries around the world. \r\n<br /><br /> \r\nProfessionally, I am interested in how emerging technologies and instruction can be used in library settings to improve information literacy and enrich the lives of both students and the general public."
