    background: "I've been developing software for nearly as long as I can remember, and have been doing so professionally for well over a decade now.  I've worked almost exclusively for universities, and am proud that the software I've produced and maintained has supported educational and scientific pursuits.\r\n<br/><br/>\r\n\r\nBefore moving up to Indiana, I worked for IFAS/CALS at the University of Florida, over a span of 10 years and in a wide range of IT capacities, culminating with my favorite job title so far: \"IT Expert\".  My systems there supported on-campus academic units, the state Extension Service, and the USDA's Sustainable Agriculture Research and Education program.\r\n<br/><br/>\r\n\r\nIndiana became my home in 2008 and I started working at the Kelley School of Business at Indiana University shortly thereafter.  My work there included developing and supporting a variety of knowledge delivery tools, classroom support apps, and line-of-business systems for both their online and on-campus programs.\r\n<br/><br/>\r\n\r\nI joined CNS in February of 2014 and I'm looking forward to helping them provide humanity with insights into what it knows.  I believe in the advancement of knowledge, and am glad to work with a team organized around the goal of making knowledge accessible."
    interests: "My wife and I moved from Florida to get away from the interminable summers, and have found Bloomington a beautiful, welcoming, and climatologically well-rounded city.\r\n<br/><br/>\r\n\r\nI'm a maker.  I enjoy needle felting, knitting, making laser-cut objects out of acrylic and wood, and dabble in carpentry, circuitry, and enjoy making things both artistic and practical out of any medium I can use.  Bloomington's local hackerspace, Bloominglabs, is my home-away-from-home.\r\n<br/><br/>\r\n \r\nI'm a gamer.  I like games that either engage my brain or let me turn it off entirely.  Tabletop and board gaming are my favorites--the narrative flow and character interaction of roleplaying games is something I can't get enough of, and I love to test my knowledge in trivia games.  That said, I play just as many dumb \"just tap somewhere\" phone games.\r\n<br/><br/>\r\n \r\nI'm a geek.  I'm cool with that."
    dateStart: '2014-02-24'
    dateEnd: '2017-02-24'
