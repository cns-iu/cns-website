    background: >-
      I am originally from Maryland but spent a few years living near the beach
      in Florida. I met and married a born-and-bred Hoosier and have been in
      Indiana for 3 years. Before coming to IU, I worked as an Administrative
      Assistant at Lucas Oil Stadium, in Indianapolis. We moved from Indy to a
      small town a little north of Bloomington in December.
    interests: >-
      When I’m not at work, I enjoy cooking, reading, and spending time with my
      husband sitting on the porch drinking coffee and watching our neighbors
      (deer, raccoons, and opossums) come and go. Since moving to the country, I
      have been trying to learn as much as I can about the plants that grow on
      our property and how to be a good steward of the land. I’m especially
      looking forward to the leaves changing, as this will be our first fall in
      our home! The area in and around Monroe County is so beautiful and reminds
      me of where I grew up in Maryland.
