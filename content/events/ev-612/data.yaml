title: Educational Data Science
description: >-
  Traditional universities are struggling to provide expanding skill sets to
  increasingly diverse student populations while containing the costs and
  confronted with competition from technologically novel educational platforms
  such as MOOCs. Just as precision medicine, supply chain management, and
  targeted marketing use big data to improve efficiency and effectiveness in
  respective sectors of the economy, institutions of higher education must apply
  data-driven decision making to stay competitive and offer affordable, high
  value added education. This event features presentations on learning sciences
  research and learning analytics tools by experts from three universities—The
  University of Texas at Arlington, University of Michigan, and Indiana
  University.
