title: Places and Spaces shows the power of maps
description: >-
  Is science, or information in general, confusing or overwhelming for you?  
    
  Mapping the data might help.  
    
  “We’re often lost in information space,” said Katy Borner, co-curator of the
  “Places & Spaces: Mapping Science” exhibit at the American Museum of Science
  and Energy.  
    
  “We need better tools to deal with this flood of information,” Borner said,
  speaking to a crowd of approximately 50 local residents during a presentation
  Thursday morning at AMSE.  
    
  The “Places & Spaces: Mapping Science” exhibit, sponsored locally by AMSE and
  The Oak Ridger, closes Monday.  
    
  The exhibit was created to demonstrate the power of maps, and help people
  compare and contrast the first maps of the entire planet with the first maps
  of all of science as mankind knows it.  
    
  Mapping data helps scientists and others understand how elements interact.  
    
  Without it, “we often don’t think about how things fit together,” Borner
  said.  
    
  “Places & Spaces” was originally created in April 2005 for "Mapping Humanity's
  Knowledge and Expertise in the Digital Domain" as part of the 101st annual
  meeting of the Association of American Geographers in Denver, Colo., according
  to the exhibit’s official Web site,
  [http://scimaps.org](http://scimaps.org).  
    
  Since its original creation, the exhibit has grown to include the 34
  large-format, high-resolution maps at AMSE that showcase the power of maps to
  navigate and make sense of physical places and abstract topic spaces. “Science
  is actually quite beautiful,” Borner said.  
    
  While explaining the different types of maps and information included in the
  exhibit, she also briefly described the next scientific map that curators are
  completing to include in the exhibit this year on: “Science Maps for Economic
  Decision Making.”  
    
  That map, in part, will look at the funding patterns for the National
  Institutes of Health and the Department of Energy.  
    
  “Science involves many dynamics,” Borner said.  
    
  Leean Tupper can be contacted at (865) 220-5501.
