title: IU experts organize NSF-funded conference on data-driven science policy
description: "BLOOMINGTON, Ind. --\_Indiana University data scientists will gather experts from across the globe in the nation’s capital starting today to review opportunities and challenges associated with the use of big data, visual analytics and computational models to advance public policy decisions related to science, technology and innovation.\n\n  \n\nThe [Modeling Science, Technology and Innovation Conference](http://modsti.cns.iu.edu/agenda/ \"This link opens in a new tab or window.\") takes place May 17 and 18 at the National Academy of Sciences in Washington, D.C. The two-day event is funded by the National Science Foundation’s Science of Science and Innovation Policy program, the Cyberinfrastructure for Network Science Center, the IU Network Science Institute and industry.\n\n  \n\nThe event is organized by [Katy Börner](https://www.ils.indiana.edu/people/profile.html?profile_id=2 \"This link opens in a new tab or window.\") and [Staša Milojević](https://www.ils.indiana.edu/people/profile.html?profile_id=86 \"This link opens in a new tab or window.\") of the IU School of Informatics and Computing's Department of Information and Library Science and the IU Network Science Institute.\_The welcome and opening remarks will be presented by C.D. \"Dan\" Mote Jr., president of the National Academy of Engineering.\n\n  \n\nThe conference also features presentations by high-profile science policy makers from government, academia and industry, including representatives from the National Institutes of Health, Centers for Disease Control and Prevention, National Oceanic and Atmospheric Administration, European Agency of Technology and Innovation Assessment, Harvard and Stanford universities, and PayPal.\n\n  \n\n\"One of the biggest challenges in science policy is the ability to effectively allocate resources -- both financial and human -- in ways that foster innovation,\" said Börner, IU's Victor H. Yngve Distinguished Professor of Information Science. \"The vast amount of data now available on science and technology, combined with remarkable growth in computing power, create ideal conditions for using computer modeling to not only understand but also predict probable future directions in science, technology and innovation.\"\n\n  \n\nComputational models of science, technology and innovation are used in many areas of academic research, including information science and computing, economics and the social sciences. Examples of computational models that currently benefit society are meteorological forecasts to predict weather and storms; epidemiological models to predict and prevent pandemics; and climate models to predict future scenarios and set carbon prices.\n\n  \n\nCompanies such as Netflix and Amazon regularly use advanced data mining, modeling and visualization algorithms to advance their goals, Börner added, yet government and academia have been slower to employ these tools to improve human decision-making.\n\n  \n\nOther roles that data models could play in science policy include the creation of \"policy flight simulators\" that empower decision-makers to test-run likely future scenarios before supporting specific projects; \"science forecasts\" that communicate local and global news in science, technology and innovation to a general audience; and a \"[FundRank model](http://modsti.cns.iu.edu/wp-content/uploads/2016/04/Data-Driven-Science-Policy.pdf \"This link opens in a new tab or window.\")\" to award research dollars based on expert crowdsourcing versus the traditional grant proposal review process.\n\n  \n\nThis concept, inspired by the “PageRank” technology that powers Google, has been proposed by IU associate professor Johan Bollen, Börner and colleagues at IU. The \"policy flight simulator\" concept has been implemented by scientists at the Stevens Institute of Technology.\n\n  \n\nIU presenters at the conference include Santo Fortunato, professor in the School of Informatics and Computing; Timothy Slaper, director of economic analysis at the IU Kelley School of Business' Indiana Business Research Center; and Xiaoran Yan, a research scientist at the [IU Network Science Institute](http://iuni.iu.edu/ \"This link opens in a new tab or window.\").\n\n  \n\nBörner and Milojević will each moderate a panel discussion and deliver opening and closing remarks, respectively. Milojević will also present a talk on the role of small teams in big science era. Daniel O’Donnell, project manager for the [Cyberinfrastructure for Network Science Center](http://cns.iu.edu/ \"This link opens in a new tab or window.\"), will attend as the local organizer of conference activities.\n\n  \n\n\"Computational and statistical modeling will become increasingly important to science policy, since we need to understand the principles that govern the practice of science to maximize its benefits to society,\" said Milojević, IU associate professor of information and library science, whose own research involves creating models of how teams emerge and grow. \"I'm excited about this conference, which will bring together leading experts in the modeling of science. We hope to help bridge the gap between academic, interdisciplinary research and real-world decision-making by policy-makers and funding agencies.\"\n\n  \n\nIn addition to the NSF-funded conference, Börner recently played a role at another major conference on big data and science policy, presenting at the [International Symposium on Science of Science at the Library of Congress](http://icss.ist.psu.edu/ \"This link opens in a new tab or window.\") in March. Other IU talks at this conference were delivered by Ying Ding, Filippo Menczer and Filippo Radicchi, all in the IU School of Informatics and Computing, and Weihua An in the College of Arts and Sciences' Department of Sociology and Department of Statistics."
