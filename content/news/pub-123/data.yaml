title: Registration open for VIVO Conference 2014
description: "Registration is now open for the 2014 VIVO Conference, which will take place in Austin, Texas, from August 6-8. The\_VIVO conference\_is an excellent opportunity to meet with VIVO team members from participating institutions, and it\_offers an open and collaborative environment to share ideas and discuss topics related to adoption and implementation of VIVO, VIVO-based tools and the opportunities created by advancing data sharing and team science.\_This year, the conference will be co-located with the\_Science of Team Science (SciTS)\_conference, and attendees will be able to freely attend both VIVO and SciTS presentation.  \n  \nKaty\_Börner has been invited to speak at this year's conference. Katy Börner is the Victor H. Yngve Professor of Information Science in the Department of Information and Library Science, School of Informatics and Computing, Adjunct Professor at the Department of Statistics in the College of Arts and Sciences, Core Faculty of Cognitive Science, Research Affiliate of the Center for Complex Networks and Systems Research, Member of the Advanced Visualization Laboratory, and Founding Director of the Cyberinfrastructure for Network Science Center at Indiana University in Bloomington, IN and a Visiting Professor at the Royal Netherlands Academy of Arts and Sciences (KNAW) in The Netherlands. She is a curator of the international Places & Spaces: Mapping Science exhibit. She holds a MS in Electrical Engineering from the University of Technology in Leipzig, 1991 and a Ph.D. in Computer Science from the University of Kaiserslautern, 1997. She became an American Association for the Advancement of Science (AAAS) Fellow in 2012.\_  \n  \nVisit\_[www.vivoconference.org](http://www.vivoconference.org)\_for more information on this year's conference.  \n  \n[Register for the conference here](https://www.etouches.com/ereg/newreg.php?eventid=87055&&eb=124780)"
