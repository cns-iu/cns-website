title: Börner - Keynote on Data at Cartographic Summit
description: "_“There have been radical changes in how people access, interact with, and create maps.”_ \\[[about Summit](http://www.esri.com/events/cartographic-summit/about)\\]\n\n  \n\n[ILS Professor Dr. Katy Börner](http://www.ils.indiana.edu/people/profile.html?profile_id=2) will present the “Keynote on Data” address at the [Cartographic Summit on the Future of Mapping](http://www.esri.com/events/cartographic-summit/speakers).\_ The Summit will be held from February 8-10, 2016 at the ESRI Headquarters in Redlands, California.\n\n  \n\nHer talk is titled “Improving Data Visualization Literacy: How to Empower Anyone to Read and Make Visualizations.”\n\n  \n\nBörner comments: “In the information age, being able to “read and write” data visualizations is becoming as important as being able to read and write text. The tools we develop at [CNS \\[Cyberinfrastructure for Network Science Center\\]](http://cns.iu.edu/) are taught in the [Information Visualization MOOC (IVMOOC)](http://cns.iu.edu/ivmooc.html) and they empower thousands to render data into insights.”\n\n  \n\nThe Summit “will explore research, innovation, and strategic thinking to support cartographic needs as we move forward. The intent is to set a marker for understanding common challenges from a range of perspectives in and outside the traditional cartographic communities; to draw together different ways of thinking and working; and to build bridges across the many communities in the mapmaking and visualization fields.” [\\[about Summit](http://www.esri.com/events/cartographic-summit/about)\\]"
