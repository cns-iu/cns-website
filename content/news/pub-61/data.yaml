title: 'Science in Culture: Chart Toppers'
description: >-
  It was often said that geography was about maps, and history about chaps. But
  there are virtually no sets of data — about chaps or anything else — that
  cannot be mapped, although sometimes a visually appealing map can hide as much
  as it reveals. This is the message of the exhibition 'Places and Spaces:
  Mapping Science' ([scimaps.org](http://scimaps.org)), which can be seen [at
  the New York Hall of
  Science](http://ivl.cns.iu.edu/km/exhibit/2007-rudy-nyhs-nyc/nyhs.html) until
  25 February, after which it will tour the United States, Japan and Europe.  
    
  Curated by Katy Börner and Julie Smith of Indiana University, the exhibition
  contains a judicious selection of early and modern maps that lay out in
  various ways how historic cultures have charted the configuration of the Earth
  and the heavens. There are also specialist maps showing, for example, the
  distribution of telegraphic linkages, exports and poverty. The charts of
  scientific papers and patents by region are especially revealing, the latter
  showing the globe grotesquely morphed by 'fat' zones of high innovative
  activity.  
    
  Relationships between 'chaps' are also mapped, with networks of scientists and
  citations to the fore. Scientific disciplines are laid out according to their
  apparent relationships, and historical episodes are charted over time and
  space, most notably the discovery of DNA. Internet activity is plotted both
  architecturally and dynamically.  
    
  As the entities in the charts become more conceptual, the challenges become
  more complex and ultimately intractable. One set of juxtapositions in two
  dimensions necessarily precludes others that may be equally valid. An attempt
  to devise a two-dimensional distribution of geographical terms ends up by
  separating space in its political dimension from urban planning, which cannot
  be right.  
    
  The non-topographical mapping seems distinctively modern. But one of the most
  effective statistical maps is also the earliest in the exhibition. In 1869,
  the retired French engineer Charles Joseph Minard produced a remarkable [map
  of Napoleon's catastrophic invasion of
  Russia](http://scimaps.org/maps/map/napoleons_march_to_m_9/). It has hardly
  been surpassed for visual efficacy, and was acclaimed by the pioneer of
  'cinematographic' photography, Etienne-Jules Marey, for its "brutal
  eloquence".  
    
  The basis of Minard's map (shown here) is a straightforward chart of the
  territory traversed by the French army in the winter of 1812–13, from Kowno
  (Kaunas) on the left to Moscow on the right. The width of the tinted strip
  represents the number of soldiers in the French army as it progresses
  eastwards. The plot doesn't thicken — quite the reverse in fact, beginning
  with a rearguard of 33,000 men branching off to remain at Polotsk. A series of
  abrupt falls then brings the company of 422,000 down to 100,000 by the time
  they reach Moscow.  
    
  The black line represents the retreating body of soldiers after they had
  sacked the Russian capital. The diminishing band is temporarily boosted from
  20,000 to 50,000 as the rearguard rejoins, but at the River Berezina a Russian
  attack triggers a shambles. A stark black step graphically records the extent
  of the disaster.  
    
  Even more remarkably, Minard also charts one of the causal factors, the severe
  drop of temperature, on the army's return march during November and early
  December. By 6 December it had reached -30 °C and the army had been scythed
  down to a tiny rump of just 12,000 men.  
    
  Minard's map is both a vivid graphic and a tool for analysis, and forms the
  basis for further questions, such as the onset of infections, food
  deprivation, failure of equipment, and shortage of ammunition. Minard's map
  lays down a series of challenges in lucidity, functionality and potentiality
  that few since have fully met.  
    
  All this was accomplished by Minard after the age of 70. His last act was to
  publish the Napoleonic map in juxtaposition to one showing the Roman emperor
  Hadrian's disastrous losses on his return trip across the Alps from his
  northern expedition. It was designed to demonstrate the enduring human cost of
  war.
