title: 'Open Call: Science Maps for Kids (website accessed 12/08/2011)'
description: >-
  The _Places & Spaces: Mapping Science_ exhibit, at our academic partner
  Indiana University, has launched its 8th iteration with an open call for
  "science maps that kids aged 5-14 can use to gain a more holistic
  understanding and appreciation of science and technology." The selected maps
  are displayed in exhibits, published in print and online, and made available
  for purchase. This is a great opportunity to create and contribute maps that
  do two important things for young people: teach them about an aspect of
  science and interest them in mapping and visualization as a medium. For
  consideration, submit your maps by January 10th, 2012. All the details can be
  found at: [http://scimaps.org/call](http://scimaps.org/call).
