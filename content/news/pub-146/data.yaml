title: >-
  IU's Katy Börner, Noretta Koertge and Jessica Gall Myrick to present at AAAS
  2016
description: "BLOOMINGTON, Ind.—Faculty experts from Indiana University will join thousands of scientists converging on Washington, D.C., from Feb. 11 to 15 at the 2016 Annual Meeting of the American Association for the Advancement of Science.  \n  \nThe IU scientists will travel to the nation’s capital to deliver presentations and accept honors in recognition of their roles as leaders in the fields of informatics, chemistry, biology, the philosophy of science and others.  \n  \nOn Feb. 13, [Katy Börner](http://info.ils.indiana.edu/~katy/), Distinguished Professor and the Victor H. Yngve Professor of Information Science in the IU School of Informatics and Computing, will deliver [\"Visual Analytics: Mining, Mapping, and Accelerating Local and Global Science and Technology](https://aaas.confex.com/aaas/2016/webprogram/Paper16096.html),\" about tools for improving information access, research management and networking among scientists.  \n  \n\nAn internationally recognized expert on data visualization and science of science studies, Börner focuses her research on the development of data analysis and visualization techniques to assist with access, management and interpretation of data. She is also the founding director of\_[IU's Cyberinfrastructure for Network Science Center](http://cns.iu.edu/ \"This link opens in a new tab or window.\"); curator of \"[Places and Spaces](http://scimaps.org/ \"This link opens in a new tab or window.\"),\" an international traveling exhibit on data mapping; and the author of two beautifully illustrated books by MIT Press: \"Atlas of Science,\" published in 2010, and \"Atlas of Knowledge,\" published in 2015.\n\n  \n\nBörner’s presentation is part of \"[New Science Roadmaps for Global Research](https://aaas.confex.com/aaas/2016/webprogram/Session11617.html \"This link opens in a new tab or window.\")\" from 3 to 4:30 p.m., organized by Ben Shneiderman, University of Maryland, with a discussion lead by Peter Arzberger of the National Science Foundation.\n\n  \n\nView the full story at [IT News & Events](https://itnews.iu.edu/articles/2016/ius-katy-borner,-noretta-koertge-and-jessica-gall-myrick-to-present-at-aaas-2016.php)."
