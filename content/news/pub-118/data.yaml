slug: pub-118
title: >-
  Visualising Research: using data visualisation to explore how research is
  funded in the UK
date: '2014-03-04'
link: https://cns.iu.edu/docs/news/20140304_STMPublishing.html
description: "Around £3 billion of Government funding is apportioned annually between the seven UK Research Councils. This investment creates a huge amount of information, which is held in the\_[‘Gateway to Research’](http://gtr.rcuk.ac.uk/)\_database and available for anyone to access online. But how can people make sense of this mass of complex data in its raw form?  \n  \nInspired by the British Library’s newest exhibition,\_**_Beautiful Science_**, the\_**Biotechnology and Biological Sciences Research Council (BBSRC)**, the\_[Arts and Humanities Research Council (AHRC)](http://www.ahrc.ac.uk/Pages/Home.aspx)and the\_[British Library](http://www.bl.uk/)\_have launched a competition which challenges entrants to create a striking visualisation using this data, and reveal to the public how research is funded in the UK.  \n  \n[‘Visualising Research’](http://datasets.org.uk/compo/compo.html)\_is open to designers, graphic artists, software developers, programmers and anyone with an interest in data visualisation. The winning entry will need to tell a compelling story that anyone will be able to understand, and will make use of the complex data available in the\_[Research Councils UK](http://www.rcuk.ac.uk/)\_database. Anyone can enter from around the world– either as an individual or with others, and the winning entry will be awarded a £2000 cash prize.  \n  \nThe closing date for the competition is\_**21 March 2014****,**\_and our judges include Professor\_[Jackie Hunter](http://www.bbsrc.ac.uk/organisation/structures/executive/chief-executive.aspx \"Jackie Hunter\"), Chief Executive,\_[BBSRC](http://www.bbsrc.ac.uk/home/home.aspx),\_[Katy Börner](http://ils.indiana.edu/faculty/spotlight/index.php?facid=4 \"Katy Borner\"), the Victor H. Yngve Professor of Information Science at Indiana University and the\_[Guardian Digital Agency](http://www.theguardian.com/digital-agency \"GDA\")."
publisher: STM Publishing News
reporter: James Douglas
