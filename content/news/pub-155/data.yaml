title: Mit Karten die Welt verstehen
date: '2017-07-27'
link: https://cns.iu.edu/docs/news/20170727-hsmw.html
description: >-
  **Bekannte Spezialistin für Datenvisualsierung Katy Börner von der Indiana
  University Bloomington, USA, zu Gast in Mittweida**

    

  Ihre Leidenschaft liegt darin, Wert und Schönheit von Wissen verständlich
  näher zu bringen. Das macht sie nicht mit langen Texten, unübersichtlichen
  Tabellen und komplizierten Grafiken - Professor Katy Börner nutzt Karten, um
  Daten sichtbar zu machen. So entstehen „Landkarten“ des Wissens. Bekannt sind
  ihr „Atlas of Knowledge“ und der „Atlas of Science“, die die Prinzipien und
  Vorzüge des “Science mapping” beschreiben.

    

  Katy Börner forscht und lehrt seit zwanzig Jahren in den USA. Im Juli war die
  Wissenschaftlerin auf Heimatbesuch in Sachsen und dabei auch an der Hochschule
  Mittweida zu Gast. Geboren in Leipzig studierte sie dort Elektrotechnik,
  promovierte an der Uni Kaiserslautern. Dann ging sie in die USA, wo die heute
  Fünfzigjährige Professorin für „Information Science“ an der Indiana University
  Bloomington (IUB) ist.

    

  **Daten sichtbar machen - die Welt verstehen**

    

  Katy Börner ist überzeugt, dass im Informationszeitalter die Fähigkeit
  Datenvisualisierungen zu erstellen und zu interpretieren, genauso wichtig ist,
  wie Texte lesen und schreiben zu können. Sie hat zu diesem Thema einen Massive
  Open Online Course (MOOC), den "Information Visualization MOOC" (IVMOOC)
  entwickelt, der in die theoretischen Grundlagen und praktischen Anwendungen
  der Datenvisualisierung einführt. Studierende aus über einhundert Ländern
  haben bereits an diesem Online-Kurs teilgenommen – auch Studierende der
  Hochschule Mittweida.

    

  **Gemeinsam forschen in der alten Heimat**

    

  Im Juli kam es nun zu einer „leibhaftigen“ Begegnung von Mittweidaer
  Studierenden und Professoren mit der renommierten Wissenschaftlerin aus den
  USA. Der Kontakt entstand über Professor Klaus Liepelt von der Hochschule
  Mittweida und dessen Kollegen Professor Thomas Köhler von der TU Dresden.

    

  Die beiden möchten Katy Börner zu einem längeren Forschungsaufenthalt nach
  Sachsen holen, in dem auch eine Zusammenarbeit mit der Hochschule Mittweida
  vorgesehen ist. Der Besuch am 11. Juli diente so zum Kennenlernen der
  Hochschule und zu ersten Gesprächen über die mögliche Zusammenarbeit in
  Forschungsprojekten.

    

  Den Auftakt am Vormittag bildete ein Besuch in der Fakultät Medien. Am
  Nachmittag gab zunächst Heike Höhne Einblicke in die Erfahrungen mit dem
  IVMOOC von Katy Börner in der Lehre an der Hochschule Mittweida. Heike Höhne
  hatte im vergangenen Jahr Masterstudierende bei der Teilnahme am Kurs
  begleitet, der auch künftig weiter an der Hochschule eingesetzt werden soll.

    

  Den Abschluss von Börners Besuch bildete ein Forschungskolloquium, das zum
  einen Studierenden und Professoren aus Mittweida Einblicke in die Forschung
  von Katy Börner gab und zum Austausch animieren sollte. Zum anderen konnte der
  Gast aktuelle Forschungsprojekte kennenlernen und so Anknüpfungspunkte für
  gemeinsames Forschen identifizieren, die schon bald zu einem Austausch von
  Doktoranden mit der IUB führen sollen.

    

  Neben Katy Börner, die umfassende Einblicke in die Datenvisualisierung und den
  Wert von Karten für die Wissenschaftskommunikation gab, präsentierten drei
  Wissenschaftler von der Hochschule Mittweida und der TU Dresden ihre
  Forschungsthemen.
