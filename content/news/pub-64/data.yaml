title: 'Features: A Map of Science'
description: >-
  A MAP OF SCIENCE created by Sandian Kevin Boyack with collaborators Richard
  Klavans and Brad Paley, resembles a filamentous microorganism you might see
  under a microscope.  
    
  The map represents 800,000 scientific papers (shown as white dots) and shows
  relationships between them and different scientific disciplines. The
  "filaments" are common words unique to each "scientific paradigm" — the 776
  red circular nodes or clusters of papers. Each node contains papers that are
  commonly cited together. Larger nodes have more papers. Nodes are connected
  with lines of various lengths and thicknesses, denoting the strength of the
  citation linkages between the nodes. Layout of the nodes was done using
  Sandia's VxOrd clustering algorithm. Chemistry papers are found in the
  right-hand peninsula while astrophysics is located at the top. Medicine covers
  the large region at the lower left.  
    
  A four-foot-by-four-foot version of the map is on display at the New York Hall
  of Science until Feb. 25 as part of the "Places & Spaces: Mapping Science"
  exhibition. This image also appeared in the Gallery section of the 2006
  year-end issue of Nature (vol. 444, p. 985).  
    
  Boyack, a founding member of the advisory board of Places & Spaces, produced
  the map in collaboration with Klavans, SciTech Strategies of Berwyn, Pa., and
  Paley, graphic artist and director of Information Esthetics, New York, N.Y.,
  using 2003 data from Thomson ISI. It was enabled by work performed under a
  Laboratory Directed Research and Development project whose purpose was to
  generate large-scale maps of science for planning and evaluation purposes.  
    
  For more information on interpreting the map see Paley’s website
  [http://didi.com/brad/mapOfScience](http://didi.com/brad/mapOfScience). For
  details on the exhibition see
  [http://www.scimaps.org](http://www.scimaps.org).
