title: Katy Börner invited to speak at 2014 VIVO Conference
date: '2014-08-04'
link: https://cns.iu.edu/docs/presentations/2014-borner-vivo.pdf
description: >-
  Katy Börner will appear as a guest speaker at the 5th Annual VIVO Conference
  in Austin, Texas, on Friday, August 8, 2014. See her presentation
  [here](http://cns.iu.edu/docs/presentations/2014-borner-vivo.pdf).  
    
  This year's VIVO conference, which runs from August 6-8, 2014, creates a
  unique opportunity for people from across the country and around the world to
  come together in the spirit of promoting scholarly collaboration and research
  discovery. It offers an excellent opportunity to meet with VIVO team members
  from participating institutions and an open and collaborative environment to
  share ideas and discuss topics related to adoption and implementation of VIVO,
  VIVO-based tools and the opportunities created by advancing data sharing and
  team science.  
    
  This year, VIVO is co-locating with the annual Science of Team Science
  Conference (SciTS). Attendees will benefit by having access to content
  throughout both conferences.  
    

  ### About VIVO


  VIVO enables the discovery of researchers across institutions. Participants in
  the network include institutions with local installations of VIVO or those
  with research discovery and profiling applications that can provide semantic
  web-compliant data. The information accessible through VIVO's search and
  browse capability will reside and be controlled locally, within institutional
  VIVOs or other semantic web-compliant applications.  
    
  VIVO is an open source semantic web application originally developed and
  implemented at Cornell. When installed and populated with researcher
  interests, activities, and accomplishments, it enables the discovery of
  research and scholarship across disciplines at that institution and beyond.
  VIVO supports browsing and a search function which returns faceted results for
  rapid retrieval of desired information. Content in any local VIVO installation
  may be maintained manually, brought into VIVO in automated ways from local
  systems of record, such as HR, grants, course, and faculty activity databases,
  or from database providers such as publication aggregators and funding
  agencies.  
    
  The rich semantically structured data in VIVO support and facilitate research
  discovery. Examples of applications that consume these rich data include:
  visualizations, enhanced multi-site search through VIVO Search, and
  applications such as VIVO Searchlight, a browser bookmarklet which uses text
  content of any webpage to search for relevant VIVO profiles, and the
  Inter-Institutional Collaboration Explorer, an application which allows
  visualization of collaborative institutional partners, among others.
