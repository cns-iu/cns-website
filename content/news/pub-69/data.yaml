title: 'ISSI 2013: Börner teaches tutorial, organizes workshop, presents two papers'
description: >-
  On Monday, July 15, 2013, Katy Börner taught a Sci2 tutorial and organized a
  workshop at the 14th ISSI Conference in Vienna, Austria, in addition to
  presenting two papers.  
    
  [Sci2: A Tool of Science of Science Research and
  Practice](/docs/presentations/2013-borner-sci2tutorial-issi.pdf) was a
  tutorial designed for researchers, practitioners, program staff from federal
  agencies and graduate students interested to use advanced data mining
  algorithms and visualizations in their work to map the structure and dynamics
  of science. They will use the [Science of Science (Sci2)
  Tool](http://sci2.cns.iu.edu) to run temporal, geospatial, topical, and
  network analysis and visualization workflows designed to increase our
  understanding of science and technology developments. The first hour of the
  tutorial provided a basic introduction of the tool. Remaining time was spent
  discussing sample workflows featured in the [Sci2
  Tutorial](http://sci2.wiki.cns.iu.edu) and new functionality such as the
  Twitter and Flickr readers, the Yahoo! geocoder, networks overlaid on
  geospatial maps, network clustering and backbone identification algorithms,
  and the analysis and visualization of evolving networks.  
    
  The workshop organized by Börner was entitled [Standards for Science Mapping
  and Classifications](http://lariviere.ebsi.umontreal.ca/workshop.html). It
  built on and extended the [JSMF Workshop on Standards for Science Metrics,
  Classifications, and Mapping](http://scimaps.org/meeting/110810) that took
  place August 11-12, 2011 at Indiana University in Bloomington, IN. It brought
  together researchers and practitioners interested in the scientific
  development and proper usage of science classifications and science maps.
  Demonstration of existing approaches, tools, and techniques provided a point
  of departure for a discussion of challenges and opportunities for developing
  scientifically sound standards for measuring and communicating the structure
  and dynamics of science and technology (S&T).  
    
  In addition to the tutorial and workshop, Börner also presented the following
  papers at the conference:  
    
  Light, Robert, Ted Polley, and Katy Börner. ["Open Data and Open Code for Big
  Science of Science
  Studies"](http://stage.cns.iu.edu/docs/publications/2013-light-sdb-sci2-issi.pdf).
  ISSI 2013.  
    
  Reijnhoudt, Linda, Rodrigo Costas, Ed Noyons, Katy Börner, and Andrea
  Scharnhorst. ["'Seed+Expand': A validated methodology for creating high
  quality publication oeuvres of individual
  researchers"](http://stage.cns.iu.edu/docs/publications/2013-reijnhoudt-seed-expand-issi.pdf).
  ISSI 2013.
