slug: pub-114
title: 'Mapping the Unseen: Science Film Showcase - Chicago'
date: '2014-02-05'
link: https://cns.iu.edu/docs/news/20130205_ILSNews.pdf
description: >-
  A movie with IU roots, [_Humanexus: Knowledge and Communication through the
  Ages_](http://yfshen.info/humanexus/) will be screened at the International
  House, University of Chicago on February 12, 2014. The event features "clips
  and commentary from filmmakers and scientists":  
    
  [Mapping the Unseen: Science Film
  Showcase](http://www.eventbrite.com/e/science-film-showcase-tickets-9946314695)  
    
  _How do we measure or observe the world just outside our reach?_ A spectrum of
  scientist-filmmakers investigate our near, and perhaps not-so-near,
  surroundings. An Adler Planetarium program visits the upper atmosphere (and
  edge of space). A grandson considers the laws of thermodynamics in an empty
  house. Abstract phenomena and complicated communications systems are
  visualized via animation and computer modeling. Each film, or set of films,
  will be followed by discussion of the themes between scientists and
  filmmakers.  
    
  The Science Film Showcase is presented with generous support from Education
  and Human Resources, The American Association for the Advancement of Science;
  Imagine Science Films; International House at UChicago Global Voices Program;
  UChicago Art│Science Initiative; and UChicago Office of the Vice President for
  Research and for National Laboratories.  
    
  The American Association for the Advance of Science (AAAS) highlights the
  [Film Showcase on their
  website](http://www.aaas.org/page/2014-science-film-showcase). ILS faculty
  member [Dr. Katy
  Bӧrner](http://ils.indiana.edu/faculty/spotlight/index.php?facid=4) notes that
  "the Humanexus movie is a result of a unique collaboration between Information
  Science at the School of Informatics and Computing, Ying-Fang Shen's
  design+art, and Nobert Herber's sound design." All three faculty members were
  at Indiana University at the point of initial collaboration. For more about
  the movie, including a three minute trailer, visit [the film's official
  website](http://yfshen.info/humanexus/).  
    
  Movie Synopsis: The human race has long searched for meaningful interpersonal
  connections. Tools and technologies have made it easier to reach out and share
  ideas, but each presents a new, unforeseen challenge. We must always ask: "Is
  this what we want? What do we want?"  
    
  Dr. Bӧrner will be one of the presenters at the Film Showcase.
