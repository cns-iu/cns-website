title: How Scientific Paradigms Relate
description: >-
  Here is a [giant chart mapping relationships among scientific
  paradigms](http://www.seedmagazine.com/news/2007/03/scientific_method_relationship.php),
  as published in the journal Nature. This [map](http://mapofscience.com/) was
  constructed by [sorting roughly 800,000 published papers into 776 different
  scientific paradigms](http://www.didi.com/brad/mapOfScience/index.html) (shown
  as pale circular nodes) based on how often the papers were cited together by
  authors of other papers. Information Esthetics, an organization founded by map
  co-creator [W. Bradford Paley](http://www.didi.com/brad/), is [giving away 25"
  x 24" prints of the Map of Science](http://informationesthetics.org/node/20)
  (you pay postage and handling via PayPal). There are also links to a 3000+
  pixel wide jpg of the chart. It would be all one long spectrum except for
  Computer Science, which makes the connection (via AI) between the hard
  sciences and the soft sciences.
