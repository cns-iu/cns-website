slug: pub-36
title: Connected—The Power of Six Degrees
date: '2008-10-28'
link: https://cns.iu.edu/docs/news/20081028_AustralianBroadcastingCorp.pdf
description: >-
  We speak with one of the world's leading researchers on the new science of
  networks, Professor Duncan Watts.  
    
  A new documentary directed by Annamaria Talas explores the science behind six
  degrees of separation, how we're just six steps away from anyone else in the
  world.  
    
  It's more than a curiosity; network science has implications for everything
  from the spread of disease to the current financial crisis.  
    
  The documentary _How Kevin Bacon Cured Cancer_ screens on ABC 1 tonight at
  8.30.
publisher: Australian Broadcasting Corporation, Ltd.
reporter: Anna Maria Talas
