title: >-
  Patterns of NIH Funding in 1999 Overlaid on a Base Map of Science (website
  accessed 8/28/08)
description: >-
  The base map was created from citation patterns among a set of over 7,000
  scientific journals. The profile for NIH was calculated by matching the
  principal investigators and their institutions from grants funded in 1999 to
  first authors and their institutions on papers indexed in 2002. Colored nodes
  show the distribution and numbers of papers linked to grants; red nodes
  indicate faster moving science than yellow nodes; colored edges show linkages
  in the NIH funding profile that are stronger than the corresponding linkages
  in the base map of science. Reprinted by permission from Boyack, K. W.,
  Börner, K., & Klavans, R. (2008). Mapping the structure and evolution of
  chemistry research. Scientometrics, in press.
