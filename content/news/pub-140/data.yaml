title: Börner Appointed to U.S. Department of Commerce - Data Advisory Council
date: '2015-02-18'
link: https://cns.iu.edu/docs/news/20150218_SoICNews.html
description: "[Katy Börner](http://www.soic.indiana.edu/all-people/profile.html?profile_id=2), Victor H. Yngve Professor of Information Science, has been appointed to a two year term as a member of the U.S. Department of Commerce’s Data Advisory Council. The confirmation letter received (February 2015) noted:  \n  \n“Commerce’s Data Advisory Council will feature the best and brightest private and public sector thought leaders on data management\_and dissemination, to help guide our Department’s data revolution; to foster innovation, create jobs, and drive better decision-making throughout our economy and society. Members represent the entire spectrum of Commerce data including demographic, economic, scientific, environmental, patent, and geospatial data. Your participation in this Council is critical to our agency’s success and we greatly appreciate your willingness to serve.”  \n  \nThe mission of the Council was included on an announcement in the\_[Federal Registrar](https://www.federalregister.gov/articles/2014/11/17/2014-26778/establishment-of-commerce-data-advisory-council-solicitation-of-nominations-for-membership)\_on November 17, 2014 – and excerpt is included here: “The Under Secretary for Economic Affairs, Economics and Statistics Administration, announces the establishment of the Commerce Data Advisory Council (CDAC) by the Secretary, Department of Commerce. The CDAC will provide advice and recommendations to the Secretary on ways to make Commerce data easier to find, access, use, combine, and disseminate, and on other such matters as the Secretary determines.\""
publisher: SoIC News
