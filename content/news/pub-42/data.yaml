title: Image of the Week-A Map of All Things Science
date: '2008-02-13'
link: https://cns.iu.edu/docs/news/20080213_ISGTW.html
description: >-
  [Katy Börner](http://ella.slis.indiana.edu/~katy/) knows what
  [Wikipedia](http://en.wikipedia.org/) looks like in English, all 2.1 million
  articles of it.  
    
  Börner, a professor at [Indiana University Bloomington](http://www.iub.edu/),
  is director of the [Information Visualization (InfoVis)
  Laboratory](http://cns-nd3.slis.indiana.edu/ivl/), and along with her InfoVis
  colleagues, Börner has analyzed and “visualized” the [network of knowledge
  that is Wikipedia in English](http://scimaps.org/maps/wikipedia/).  
    
  The image on the right is a science-themed version of the same visualization,
  created using [science-related Wikipedian
  activity](http://scimaps.org/dev/map_detail.php?map_id=165). To construct it,
  the team laid out a sample of article images on a circular grid, positioning
  similar, linked articles close together.  
    
  The result is a mosaic revealing Wikipedia’s most popular scientific areas.  
    
  **Beyond Wikipedia**  
    
  The methods of data analysis and visualization used by Börner and her
  colleagues are widely relevant beyond Wikipedia.  
    
  At InfoVis, Lab, Börner has implemented a system of data visualization
  tailored to the needs of research stakeholders. For example, one diagram shows
  collaborations on papers produced by staff and students over a year; another
  displays funding awards over five years, revealing who has received awards,
  the amount of the awards and so on.  
    
  [More maps](http://scimaps.org/maps/browse/) can be viewed at the [Places &
  Spaces](http://scimaps.org) exhibition. [An interactive version of the full
  Wikipedia visualization](http://scimaps.org/web/maps/wikipedia/) is also
  available.
