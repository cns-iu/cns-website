description: "In this episode of the BioRevolution podcast, Katy Börner joins
  Andreas Horchler and Louise von Stechow as a guest. Katy is Professor of
  Engineering and Information Science at Indiana University, leads the
  international Human Reference Atlas, and is one of the founders and curators
  behind the long-running Places & Spaces: Mapping Science exhibit. Together
  they discuss why visualization + interpretation + communication of data matter
  just as much as data collection—and how macroscopes can help us make sense of
  our complex world."
