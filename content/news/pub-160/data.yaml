slug: pub-160
title: >-
  Massive work of 'sentient art' unveiled at Luddy Hall is also a learning tool
  for students
date: '2018-04-17'
link: https://cns.iu.edu/docs/news/massive-work-of-sentient-art.html
description: "  \n\nA living, protected space of vales, canopies and membranes composed of hundreds of thousands of microprocessors, prototype cells and gently swaying Mylar fronds.\n\n  \n\nThis is the language used by Canadian artist and architect [Philip Beesley](http://philipbeesleyarchitect.com/) to describe the enormous, seemingly living sculpture, \"Amatria,\" recently installed under the sunlit glass atrium on the fourth floor of [Luddy Hall](https://news.iu.edu/stories/2018/01/iub/inside/16-newly-opened-luddy-hall.html), the new home to most of the departments and programs in the IU School of Informatics, Computing and Engineering.\n\n  \n\nDescription of the following video:\n\n  \n\nVideo transcript: Philip Beesley/\"Amatria\" video  \n  \n\_  \n  \n\\[Upbeat music\\]  \n  \n\_  \n  \n\\[Video: Students assemble a hanging sculpture. We see different parts of the sculpture from below. It includes translucent plastic fronds, colorful beads, sensors and microprocessors, all arranged into vales, canopies and membranes. People look at and react to the sculpture, which hangs from the ceiling inside a building.\\]  \n  \n\_  \n  \nA male speaks: When people walk into the environment of this kind of sculpture, some reactions are quite anxious. \"What on earth am I looking at?\" \"What is this—is it a science experiment?\" \"What is it for?\" But then, the work starts to respond back. And so those kind of questions tend to turn pretty quickly into a kind of a curious, even wondering, conversation.  \n  \n\_  \n  \n\\[Words appear: Introducing\_\"Amatria,\" a \"living sculpture\" at the Indiana University School of Informatics, Computing and Engineering\\]  \n  \n\_  \n  \n\\[Video: A man talks.\\]  \n  \n\_  \n  \n\\[Words appear: Philip Beesley, sculptor, architect and creator of \"Amatria\"\\]  \n  \n\_  \n  \nPhilip Beesley speaks: I'm Philip Beesley. I'm a sculptor and an architect, and I work with experimental systems as part of quite a large research group called the Living Architecture Systems Group that's developed quite a strong collaboration with colleagues in Indiana.  \n  \n\_  \n  \n\\[Words appear: \"Amatria\"\_is made of\_hundreds of thousands of plastic fronds, sensors, microprocessors and prototype cells\_that\_come to life.\\]  \n  \n\_  \n  \n\\[Video: Time-lapse footage of a scaffold being built and the sculpture being installed.\\]  \n  \n\_  \n  \nPhilip Beesley speaks: We conceived the idea of making a very substantial testbed—a sculpture—which could embody some of the spirit here at Luddy Hall. Thinking about how engineering could shift and involve emotion and deeply felt values and the kind of interwoven, interconnected systems that make up our world.  \n\_  \n  \n\\[Words appear: Students helped build and install the sculpture. Going forward, they'll create devices that wirelessly communicate with its sensors and motors.\\]  \n  \n\_  \n  \n\\[Video: A crowd of people looks at the sculpture, and some people take pictures on their phones.\\]  \n  \n\_  \n  \nPhilip Beesley speaks: There are whispers that will quite literally speak back to you as you move throughout this piece. There are gestures, small vibrations and twitches. There's emanations of light—tiny bursts of light that will ripple out in waves. And those are keyed to work with your own gestures as well, and your own movements.  \n  \n\_  \n  \n\\[Words appear: You can interact with\_\"Amatria\"\_on the fourth floor of Luddy Hall.\\]  \n  \n\_  \n  \nPhilip Beesley speaks: We work very deliberately with open-ended exploration, where the environment is acting and offering itself, and where the reactions are available. And people are simply invited to explore and discover their own relationships.  \n  \n\_  \n  \n\\[Animation: Quickly rotating phrases, including \"We invent tomorrow,\" \"We connect tomorrow,\" \"We analyze tomorrow,\" \"We secure tomorrow,\" \"We program tomorrow,\" \"We design tomorrow,\" \"We engineer tomorrow\" and ending on \"We see tomorrow.\" The Indiana University trident appears with the name of the school, the School of Informatics, Computing and Engineering.\\]  \n  \n\_  \n  \n\\[The Indiana University trident appears.\\]  \n  \n\_  \n  \n\\[Words appear: Indiana University, Fulfilling the Promise, indiana.edu\\]  \n  \n\_  \n  \n\\[End of transcript\\]\n\nThe school officially unveiled the work of \"sentient art\" before a crowded audience at sunset April 11. The reveal, which featured flashing lights, dramatic music and comments from the artist and school leaders, took place during [LuddyFest](https://news.iu.edu/stories/2018/04/iub/releases/04-weeklong-celebration-in-honor-of-luddy-hall.html), a weeklong celebration that culminated in the building's dedication ceremony April 13.\n\n  \n\n\"Just like the Sample Gates are iconic of IU Bloomington, we expect 'Amatria' -- with its unique combination of art, computing, architecture and technology -- to become a symbol of our school and 'renaissance engineering' at IU,\" said IU Distinguished Professor [Katy Börner](https://www.ils.indiana.edu/people/profile.html?profile_id=2), who played the key role in bringing Beesley's work to campus after meeting him at a conference in 2015.\n\n  \n\nIt's that vision of engineering -- as a field that blends scientific and technical skill with creative thought and a foundation in the arts and humanities -- that attracted Beesley to IU. An internationally known architect whose work has been featured at the prestigious [Venice Biennale](http://www.philipbeesleyarchitect.com/sculptures/0929_Hylozoic_Ground_Venice/), as well as many other sites across the globe, Beesley is renowned for the use of cutting-edge technologies and materials -- sensor arrays, 3-D printed materials and Internet-connected objects -- to create [enormous works of art](https://www.youtube.com/watch?v=v86B9Nz_LVU) that gently move or react as people pass near or through them.\n\n  \n\n\"When people walk into the environment of this kind of sculpture, some reactions are quite anxious,\" Beesley said. \"But then the work starts to respond back -- with small ripples of vibration and movement or gentle rustling sounds and billowing light -- and those reactions quickly turn into a kind of curious, even wondering, conversation. People are invited to simply explore \\[the art\\] and discover their own relationships with it.\"\n\n  \n\n![Philip Beesley review architectural plans for Amatria](/images/news/20180417_philip-beesley.jpg)\n\n![A close up view of Amatria](/images/news/20180417_amatria-details.jpg)\n\nPhilip Beesley reviews architectural plans for \"Amatria\"; a close-up of the artwork's hundreds of thousands of components; unveiling\_of the artwork at\_sunset at Luddy Hall; .\_ Photos by Amelia Herrick and Chris Meyer, IU Communications\n\n  \n  \n\nDuring the past few years, Beesley has paid several visits to IU Bloomington to participate in behind-the-scenes preparations related to suspending a high-tech work of art composed of hundreds of thousands of custom parts from the glass atrium atop a four-story building. Most recently, he and colleagues from his Toronto-based studio were on-site to oversee the work of IU students and community volunteers, who played a key role in the sculpture's creation and installation. IU students helped assemble the sculpture's many highly intricate physical parts, wire electrical components and code systems that control how the work interacts with its environment.\n\n  \n\nAmong the volunteers was Clara Fridman, a junior in the School of Informatics, Computing and Engineering who participated in several sessions assembling various small pieces of the sculpture. A fan of Beesley's work, she also took the opportunity to hear him and members of his studio speak at several previous visiting lectures at IU.\n\n  \n\n\"I was thrilled to contribute to this amazing piece for our school,\" she said. \"Each small part of 'Amatria' is so complex that it takes the work of many people. Everyone was very helpful, and there were so many different tasks we could always switch things up. The whole experience was a great exercise in teamwork.\"\n\n  \n\nKatherine Shanahan, a graduate student in the IU School of Education, also volunteered on \"Amatria,\" assembling the plastic \"whiskers\" with fluid-filled glass bulbs that hang in the work's \"grotto\" area.\n\n  \n\n\"I was excited to volunteer because I'm very interested in the intersection of art and technology in my graduate studies,\" she said. \"The notion of sentient and responsive architecture that mimics natural, biological and chemical systems is fascinating.\"\n\n  \n\n![IU senior Nick Root packages vinegar batteries for installation in 'Amatria'](/images/news/20180417_nick-root.jpg)\n\n![Beesley works with students during the installation of 'Amatria' at Luddy Hall](/images/news/20180417_beesley-reviewing.jpg)\n\n![IU students and community volunteers assemble parts of 'Amatria'](/images/news/20180417_volunteers.jpg)\n\nFrom top: IU senior Nick Root packages vinegar batteries for installation in \"Amatria\"; Philip Beesley reviews work during the artwork's installation; volunteers assemble some of the hundreds of thousands of highly intricate\_parts that comprised the final work.\_ Photos by James Brosher, IU Communications\n\n  \n\nBy playing a role in the sculpture's creation, Beesley said, IU students gained experience in wireless technologies, robotics, artificial intelligence, sensors and other cutting-edge subjects. His studio has also designed software developer kits so students can create external components that interact with the art or visualize its activity.\n\n  \n\nBörner added that \"Amatria\" will convert the fourth floor of Luddy Hall into an \"Internet of Things laboratory\" as students learn to program devices that wirelessly communicate with the sculpture's light, motion and sound sensors and the loudspeaker and motor actuators. By working on these projects, students will gain hands-on experience writing code that utilizes data from wireless-enabled devices -- a highly applicable skill in today's internet-connected world.\n\n  \n\nIn addition to creating an artistic focal point for the building, the position of \"Amatria\" at the top of the central staircase in Luddy Hall is significant since the fourth floor houses the school's intelligent systems engineering program. A hub of technology and creatively, the floor is also home to a large \"maker space\" with 3-D printers, circuit board soldering stations and other advanced fabrication tools. The sculpture's presence in the center of the action will serve as a continual reminder of program's guiding mission to create the \"engineers of tomorrow,\" fluent in art, science and technology.\n\n  \n\n\"IU Bloomington is a leader in arts and humanities education, and the IU School of Informatics, Computing and Engineering is inventing, implementing and optimizing the next generation of intelligent systems, such as smart cars, health devices and brain interfaces,\" Börner said. \"We hope the magnificent architecture of Luddy Hall, in combination with 'Amatria,' will inspire arts and humanities scholars from campus and beyond to visit our school, and fully engage with its faculty, staff and students.\""
