title: Take a look inside the LuddyFest celebration honoring Luddy Hall
description: "The Indiana University School of Informatics, Computing and Engineering held a weeklong celebration starting April 9 in honor of [Luddy Hall](https://news.iu.edu/stories/2018/01/iub/inside/16-newly-opened-luddy-hall.html), the new 124,000-square-foot, $39.8 million home to most of the school's departments and programs.\n\n[LuddyFest](https://www.sice.indiana.edu/luddyfest/) included a lecture series from global innovators; [a student startup pitch contest](https://news.iu.edu/stories/2018/04/iub/releases/13-speech-therapy-robot-for-children-with-cleft-lip-and-palate.html); demonstrations of maker spaces and workshops; an [unveiling ceremony for \"Amatria,\"](https://news.iu.edu/stories/2018/04/iub/inside/17-sentient-art-unveiled-at-luddy-hall.html) a large, high-tech, sculptural work of art suspended from beneath the glass atrium on the fourth floor; and [a dedication ceremony](https://president.iu.edu/media/photos/2018/luddy-hall-dedication/index.html) led by IU President Michael A. McRobbie.\n\nTake a look at some of the highlights from the celebration:\n\n![Exterior of Luddy Hall](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration01.jpg)\n\n![Guest at Luddy Fest visits with others. ](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration02.jpg)\n\n![Interior of Luddy Hall.](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration03.jpg)\n\nFrom top: The exterior of Luddy Hall, the new 124,000-square-foot, $39.8 million home to the Indiana University School of Informatics, Computing and Engineering on the IU Bloomington campus; Sean Wang, dean of the School of Computer Science at Fudan University in Shanghai, China, shakes hands with a guest; students, faculty and staff visit Luddy Hall during the weeklong celebration.\_\_Photos by Eric Rudd and James Brosher, IU Communications\n\n![Tingyu Li, left, and Pavithra Ramamurthy sit with their speech therapy robot ](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration04.jpg)\n\n![Ian Rogers. ](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration05.jpg)\n\n![Student Aiden Whelan holds a headset. ](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration06.jpg)\n\nFrom top: Tingyu Li, left, and Pavithra Ramamurthy pitch their \"Buddy\" speech therapy robot for children with cleft lip and palate. The team won first prize and $7,500 at the third annual Cheng Wu Innovation Challenge; keynote speaker and IU alumnus Ian Rogers, the former senior director of Apple Music and the chief digital officer of LVMH, speaks to a crowd; engineering student Aiden Whelan, left, holds a headset as he demonstrates an interactive creation during the FabLab Showcase.\_\_Photos by Ann Schertz, Eric Rudd and James Brosher\n\n![The unveiling of the large, high-tech work of art, 'Amatria.'](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration07.jpg)\n\n![A student interacts with a guest. ](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration08.jpg)\n\n![Two artists work on the sculpture, 'Amatria.'](/images/news/20180420_take-a-look-inside-the-luddyfest-celebration09.jpg)\n\nFrom top: The audience begins to fill in before the unveiling of \"Amatria,\" a piece of \"living art\" designed by world-renowned Canadian architect Philip Beesley; a student speaks with an alumnus after a roundtable discussion; Toronto artists Luke Kimmerer, left, and Richard Mui work on the installation of \"Amatria\" leading up to LuddyFest.\_Photos by Amelia Herrick and James Brosher, IU Communications."
