title: SoIC launch ceremony announces official merger of two IU Schools
description: >-
  Friday, September 27 at 3 p.m., the recently renovated Whittenberger
  Auditorium at Indiana University will witness the official launch of the
  [School of Informatics and Computing](http://soic.iu.edu/), an entity created
  out of the merger of IU’s School of Informatics and the School of Library and
  Information Science. Indiana University President Michael A. McRobbie and SOIC
  Dean Robert B. Schnabel will preside over the occasion, and the ceremony will
  feature remarks from SOIC Professor Katy Börner and a keynote address from
  Peter Lee, Corporate Vice President and Head of Research at Microsoft. The
  reception following the inauguration will feature posters highlighting the
  work of the School’s faculty, including a special display of [Places &
  Spaces](http://scimaps.org), an international science mapping exhibit based
  out of IU’s Cyberinfrastructure for Network Science (CNS) Center.
