title: IU brings broad contingent to AAAS, nation's largest general science meeting
description: "SAN JOSE, Calif. -- The annual meeting of the American Association for the Advancement of Science, considered the largest interdisciplinary science meeting in the U.S., gets underway today with broad representation from Indiana University.  \n  \nThree IU campuses will be represented at the gathering of thousands of scientists from around the world -- IU Bloomington, Indiana University-Purdue University Indianapolis and Indiana University Northwest -- and faculty members will serve as presenters, organizers and moderators and be honored as new fellows.  \n  \nBeing named as fellows, bringing\_[IU’s total number of AAAS fellows to 89](http://news.iupui.edu/releases/iu/2014/11/2014-aaas-fellows.shtml \"This link opens in a new tab or window.\"), will be Edward J. Berbari, Chancellor’s Professor and chair of the biomedical engineering department at IUPUI; Thomas Sterling, professor of computer science in the School of Informatics and Computing at Indiana University Bloomington; and P. Sarita Soni, professor emerita in the School of Optometry at IU Bloomington.  \n  \nFour IU faculty members will present new research at the Feb. 12 to 16 conference.  \n  \nIU Bloomington Professor of Geological Sciences\_[P. David Polly](http://geology.indiana.edu/polly/ \"This link opens in a new tab or window.\")\_will participate Friday in “Earth History: Innovative Approaches to Studying Critical Transitions,” a symposium highlighting research results focused on understanding paleobiological, climatic and environmental transitions throughout Earth's history. Specifically, Polly will discuss integrating data from paleontology, geology, ecology, evolutionary biology and climatology to better understand the patterns, processes and rates of response of organisms to changing climates.  \n  \n[L. Jean Camp](http://www.soic.indiana.edu/all-people/profile.html?profile_id=178 \"This link opens in a new tab or window.\"), a professor at IU Bloomington’s School of Informatics and Computing, and\_[Bennett Bertenthal](http://psych.indiana.edu/faculty/bbertent.php \"This link opens in a new tab or window.\"), IU Bloomington’s James H. Rudy Professor of Psychological and Brain Sciences, will participate Saturday in the session “Holistic Computing Risk Assessment: Privacy, Security and Trust.” Camp will present research on security and privacy interactions in risk communication, and Bertenthal will discuss “Tracking Risky Behavior on the Web: Distinguishing Between What Users ‘Say’ and ‘Do.’” The session is organized by Camp and co-organized by\_[Diane S. Henshel](http://www.indiana.edu/~spea/faculty/henshel-dianes%20.shtml \"This link opens in a new tab or window.\"), an associate professor at IU Bloomington’s School of Public and Environmental Affairs. Henshel is also moderator for the session.  \n  \nAlso on Saturday, IU Northwest associate professor of economics\_[Surekha K. Rao](http://www.iun.edu/faculty/surekha-rao/ \"This link opens in a new tab or window.\")\_will present during the session “Solutions for Achieving Gender Equity: International Perspectives.” Specifically, Rao will present research discussing the different roles that gender empowerment, achievement in education and high per-capita income play in the development of economic opportunities for women.  \n  \n[Katy Börner](http://cns.iu.edu/current_team/bio/katy_borner.html \"This link opens in a new tab or window.\"), the Victor H. Yngve Professor of Information Science in the IU Bloomington School of Informatics and Computing, will serve as moderator on Friday for the session “Visualization Insights From Big Data: Envisioning Science, Engineering and Innovation,” which will take a look at advanced data mining and visualization techniques being used to extract patterns and trends from large and complex datasets.  \n  \nOn Sunday, Börner will be involved in two events. She hosts an exhibition of the world-traveled\_[Places & Spaces: Mapping Science](http://scimaps.org/iteration \"This link opens in a new tab or window.\")\_project at the San Jose Convention Center. The exhibit of 100 science and technology visualizations has been displayed in 113 cities in 25 countries on six continents. That same day, Börner will co-host the AAAS luncheon discussion “Visualization Metaphors for Communicating the Structure and Dynamics of Science.” The luncheon will provide an opportunity for those who produce and work with maps of science to discuss the challenges of visualizing non-spatial scientific activity and investigate concrete ways for scholars and industry to advance understanding and engagement with maps of science."
