title: KOFAC International Conference on Science and Creativity - Seoul
description: >-
  [Dr. Katy Börner](http://www.ils.indiana.edu/people/profile.html?profile_id=2)
  gave a keynote talk at the [KOFAC International Conference on Science and
  Creativity](http://www.kofac2014.com/) held December 4-5, 2014 in Seoul, South
  Korea. The conference them was “Creative Space and Content make Creative
  Culture.” In addition, she brought the [_Places & Spaces: Mapping Science_
  exhibit](http://scimaps.org) to the conference. The display (which celebrated
  its [tenth year and 100th map](http://scimaps.org/iteration) in 2014) included
  map descriptions translated into Korean.  
    
  The conference was covered by several Science Times articles in Korean:


