slug: pub-143
title: Modelling science, technology and innovation
date: '2016-02-02'
link: https://cns.iu.edu/docs/news/20160202_RSA.html
description: >-
  On May 17-18 2016, the National Academies of Sciences building in Washington,
  DC will be hosting a pioneering conference “Modeling Science, Technology &
  Innovation”  
    
  The conference will bring together leading experts from economics a range of
  scientific disciplines and backgrounds, to focus on different approaches that
  could increase our understanding of the structure and dynamics of science,
  technology and innovation. It will feature presentations that use models to
  recommend reviewers, estimate the success of clinical trials, or predict the
  success of different funding models. The event will also include presentations
  by industry that showcase how large-scale datasets and advanced computational
  models are used in commerce, education, finance, etc.  
    
  It is funded by the U.S. National Science Foundation’s Science of Science and
  Innovation Policy (SciSIP) program and aims to facilitate the generation and
  execution of a new Roadmap for the Science of Science Policy community and a
  strategic plan for the SciSIP program. To view preliminary programme
  information, please visit the [website](http://modsti.cns.iu.edu).  
    
  Get involved:  
    
  The conference organising committee is currently seeking input from companies
  and government agencies especially, but also academic institutions.
  Specifically, we are looking for the following:  
    
  1\. Examples of how computational models are used in your organisation to
  improve decision making and/or product offerings. A brief description and/or
  link to relevant web sites or publications would suffice.  
    
  2\. Names of experts who do relevant work and should definitely be informed
  about the upcoming conference and possibly be invited to planned future
  events.  
    
  Please send your responses to [Katy Borner](mailto:katy@iu.edu) FRSA. Kindly
  use “ModSTI” in the subject header when responding. The deadline for input is
  February 15, 2016.  
    
  Find the original article
  [here](https://www.thersa.org/fellowship/fellowship-news/fellowship-news/modeling-science-technology-and-innovation/).
reporter: Royal Society for the encouragement of Arts, Manufactures and Commerce
