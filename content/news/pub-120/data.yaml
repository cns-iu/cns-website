  The British Library is the national library of the United Kingdom and one of
  the world's greatest research libraries. It has the world's largest and most
  comprehensive research collection, including world-leading scientific,
  technical and medical information resources. These support researchers engaged
  in academic, commercial and public service research across all scientific
  disciplines. The Library runs regular science events and participates in major
  projects that enable better access to information for researchers, including
  the British Library DataCite service and Europe PubMed Central.  
    
  http://pressandpolicy.bl.uk/Press-Releases/www.bl.uk/science www.bl.uk/science
  and follow [@ScienceBL](https://twitter.com/ScienceBL).  
    
  The Biotechnology and Biological Sciences Research Council (BBSRC) invests in
  world-class bioscience research and training on behalf of the UK public. Our
  aim is to further scientific knowledge, to promote economic growth, wealth and
  job creation and to improve quality of life in the UK and beyond.  
    
  Funded by Government, and with an annual budget of around £467M (2012-2013),
  we support research and training in universities and strategically funded
  institutes. BBSRC research and the people we fund are helping society to meet
  major challenges, including food security, green energy and healthier, longer
  lives. Our investments underpin important UK economic sectors, such as
  farming, food, industrial biotechnology and pharmaceuticals.  
    
  For more information about BBSRC, our science and our impact see:
  [http://www.bbsrc.ac.uk](http://www.bbsrc.ac.uk/)  
    
  **Arts & Humanities Research Council (AHRC):** Each year the AHRC provides
  approximately £102 million from the Government to support research and
  postgraduate study in the arts and humanities, from languages and law,
  archaeology and English literature to design and creative and performing arts.
  In any one year, the AHRC makes approximately 700 research awards and around
  1,350 postgraduate awards. Awards are made after a rigorous peer review
  process, to ensure that only applications of the highest quality are funded.
  The quality and range of research supported by this investment of public funds
  not only provides social and cultural benefits but also contributes to the
  economic success of the UK. [www.ahrc.ac.uk](http://www.ahrc.ac.uk/)
