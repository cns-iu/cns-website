title: UK Research Council funding data comes to life in two new visualisations
date: '2014-04-29'
link: https://cns.iu.edu/docs/news/20140429_BritishLibrary.html
description: >-
  *   Competition run by British Library, BBRSC and AHRC challenged the public
  to create a visualisation showing how £3 billion of funding is apportioned
  across the UK

  *   The winners of the Visualising Research competition announced last night
  by a panel of judges from BBRSC, AHRC, Indiana University and the Guardian
  Digital Agency


  The UK Research Council apportions around £3 billion of Government funding
  every year, covering the entire spectrum of academic disciplines. This funding
  is underpinned by an enormous collection of data, which for the first time
  this week has been brought to life in a new way as a result of a competition
  held by the [Biotechnology and Biological Sciences Research Council
  (BBSRC)](http://www.bbsrc.ac.uk/home/home.aspx), the [Arts and Humanities
  Research Council (AHRC)](http://www.ahrc.ac.uk/Pages/Home.aspx) and the
  http://www.bl.uk British Library.  
    
  The competition, Visualising Research, challenged entrants to create a new
  visualisation of the UK Research Council funding data, which makes use of the
  online database ‘Gateway to Research’, and which tells a compelling story that
  anyone could understand. The two winning entrants were a professional agency
  ÜberResearch, and a collaboration between four infographic enthusiasts in
  Sheffield. Their win was announced at the British Library last night, as part
  of an event to mark the Library’s ongoing exhibition about data visualisation,
  Beautiful Science.  
    
  The winning entry in the professional category was created by ÜberResearch,
  who have created a data map showing the overall distribution of funds across
  topics, using bubble, placement and colour effects to give more detail on the
  distribution. It also applies this same technique to the portfolios of
  different research institutions and universities, revealing their unique
  preferences, priorities and gaps. Their entry can be viewed in full online
  [here](http://clients.stefaner.eu/uberresearch/uk/).  
    
  In the non-professional category, the winning entry, created by ‘Three Men and
  a Stato’ and entitled ‘Feeding the Public Mind’, shows an infographic which
  they describe as ‘like looking out from the viewing platform of a skyscraper’.
  Using the model of a brain, the four team members have displayed the whole
  breadth and depth of the funding picture, and then encourage users to ‘peer
  through the telescope’ to see the details of specific areas. You can view
  their entry in full online here.  
    
  The judges of the competition included: Professor Jackie Hunter, Chief
  Executive of BBSRC, Professor Mark Llewellyn, Director of Research at AHRC,
  Professor Katy Börner, Victor H. Yngve Professor of Information Science at
  Indiana University, and Adam Frost and Tobias Sturt from the Guardian Digital
  Agency.  
    
  Professor Katy Börner, the lead judge for Visualising Research, said: “Data
  visualization literacy—the ability to read and make visualizations—is
  important in daily life and across science, technology, and education. Open
  data, open tools, and open education make it possible for anyone to render
  data into insights, knowledge, and more informed decisions.”  
    
  Lee-Ann Coleman, Head of Science, Technology and Medicine at the British
  Library, said: “The British Library is committed to making information easily
  accessible through its own work supporting researchers, and so we’re delighted
  to be part of this competition, which is all about how you can communicate
  complex data and ideas in an innovative way. We’re also delighted to celebrate
  data in a broader sense, as part of our ongoing exhibition at the British
  Library, Beautiful Science, which looks at how data has been visualised
  through history.”

    

