title: Robert Light and Chin Hua Kong present at the 2013 VIVO Conference
description: >-
  On August 14, 2013, Senior Systems Analyst and Database Administrator Robert
  Light and Systems Architect Chin Hua Kong will present "VIVO Data and
  Visualizations: Design and Usage" at the 2013 VIVO Conference in St. Louis,
  MO.  
    
  An established VIVO instance is a treasure trove of valuable data waiting to
  be visualized and explored. This workshop will examine the tools that VIVO
  offers to visualize data, but will also look at some ways that users can
  retrieve information from VIVO and how that data can be used in other
  visualization tools (using the [Science of Science
  Tool](http://sci2.cns.iu.edu) as the example) to create novel visualizations
  and insights. Finally, we’ll take a look at the various efforts to explore
  data across VIVO instances, including
  [vivosearch.org](http://beta.vivosearch.org) and the [International Researcher
  Network](http://nrn.cns.iu.edu).  
    
  This year's VIVO conference provides a unique opportunity for people from
  across the country and around the world to come together in the spirit of
  promoting scholarly collaboration and research discovery.  
    
  The VIVO conference is an excellent opportunity to meet with VIVO team members
  from participating institutions, and offers an open and collaborative
  environment to share ideas and discuss topics related to adoption and
  implementation of VIVO, VIVO-based tools and the opportunities created by
  advancing data sharing and team science. [Click here for more
  information](https://www.eiseverywhere.com/ehome/vivo2013/home/?eb=57831).
