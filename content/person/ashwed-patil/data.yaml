    education: >-
      I am currently pursuing my Master’s degree in Information Science with a
      specialization in Data Science at Indiana University Bloomington (2017 –
      Present). I have a Bachelor’s degree in Computer Science Engineering from
      the University of Pune, India (2012 – 2016). 
    background: >-
      I am interested in computational social science, especially the use of big
      data for social good. During my undergrad, I taught underprivileged kids
      at a non-profit organization for 2 years. My background in computer
      science and experience with the nonprofit has immensely influenced my
      interests in using data science for social challenges. I am passionate
      about understanding how we could use data visualization, machine learning
      and network analysis to solve global challenges such as poverty,
      humanitarian crisis and global conflicts. In the past, I have worked on
      projects that have involved investigating opioid abuse in Indiana, using
      text mining to debunk political events and investigating development
      indicators of South Asian countries. 
    interests: >-
      I love reading about different countries and their cultures. I can make
      imaginary countries from someone’s personality traits. Besides, I love
      learning new languages, listening to music and watching cartoons. 
