    education: >-
      Britain Taylor is a Ph.D. student from Palm Beach Gardens, FL. Her area of
      study is Neuro-engineering and Complex Networks and Systems. Her research
      focus is on engineering health, mental well-being, physiological
      responses, and non-contact sensors. Britain is passionate about the impact
      of social media on mental health and physiological and behavioral
      regulation. She is currently working on the research and development of
      predictive software that can detect the vulnerability to depression during
      social media engagement. In addition, she is working on the development of
      a non-contact sensor to detect physiological responses in someone's face. 
