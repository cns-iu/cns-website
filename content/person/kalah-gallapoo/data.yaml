    background: "Kalah came to CNS in the summer of 2017 as an ISE camp counselor, and although her work here revolves around Sentient Architecture in its many forms, her primary function in the world is as an educator. When she is not teaching high school German, she can be found putting her skills to use by doing outreach and educating the public on SA via Dendrite demonstrations and construction. The close and intensive work she does with the Dendrite sculptures has earned her the title of “Mother of Dendrites” among her friends.\r\n\r\nFor a broader overview of my background, see my CV: <a href=\"https://tinyurl.com/y95hzwge\" target=\"_blank\">tinyurl.com/y95hzwge</a>\r\n"
    interests: >-
