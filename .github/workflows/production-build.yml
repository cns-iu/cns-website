name: 'Production Build'

on:
  push:
    branches: ['main']

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v2
        with:
          ref: main
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: npm ci for content-migrator
        run: npm ci
        working-directory: content-migrator
      - run: npm run job
        working-directory: content-migrator
      - name: Deploy website build
        run: |
          cp -r build dist
          cp -r assets/* dist/assets/
          cp -r content admin dist/
          cp site-assets/tracking-pixel.gif dist/tr
          cp site-assets/tracking-pixel.gif dist/tr-dev
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          commit_message: "Production deploy -- ${{ github.event.head_commit.message }}"
