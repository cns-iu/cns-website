<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <script>
      // Redirect to the correct admin site if coming here from another domain
      if (window.location.hostname !== 'cns-website.netlify.app') {
        window.location.replace('https://cns-website.netlify.app/admin/');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/slugify"></script>

    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Automatic ID generator for "slug" fields -->
    <script type="module" src="./slug-generator.js"></script>
  </body>
</html>
