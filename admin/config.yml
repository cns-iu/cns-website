x-shared-field-definitions:
  dates:
    date: &date
      name: date
      label: Date
      widget: datetime
      date_format: 'YYYY-MM-DD'
    dateStart: &dateStart
      name: dateStart
      label: Start date
      widget: datetime
      date_format: 'YYYY-MM-DD'
    dateEnd: &dateEnd
      name: dateEnd
      label: End date
      widget: datetime
      date_format: 'YYYY-MM-DD'
      required: false
  files:
    image: &image
      name: image
      label: Image
      widget: image
    link: &link
      name: link
      label: Link
      widget: file
    media: &media
      name: media
      label: Media
      widget: list
      summary: '{{fields.type}} - {{fields.url}}'
      default: []
      required: false
      fields:
        - name: type
          label: Media type
          widget: select
          options:
            - { label: Image, value: image }
            - { label: PDF, value: pdf }
            - { label: Photo gallery, value: photo-gallery }
            - { label: Poster, value: poster }
            - { label: Slides, value: slides }
            - { label: Website, value: website }
            - { label: Video, value: video }
            - { label: Video playlist, value: video-playlist }
            - { label: Other, value: other }
        - name: url
          label: File
          widget: file
        - name: description
          label: Description
          widget: string
          hint: 'Short description of the media for display on the website'
          required: false
    thumbnail: &thumbnail
      name: thumbnail
      label: Thumbnail image
      widget: file
      required: false
  misc:
    featured: &featured
      name: featured
      label: Featured
      widget: boolean
      hint: 'Whether to feature this item on the homepage'
      required: false
  primitives:
    nonNegativeInt: &nonNegativeInt
      widget: number
      value_type: int
      min: 0
  relations:
    projects: &projects
      name: projects
      label: Associated projects
      widget: relation
      collection: project
      multiple: true
      default: []
      search_fields: [name]
      value_field: slug
      display_fields: [name]
      required: false
    people: &people
      name: people
      label: People
      widget: relation
      collection: people
      multiple: true
      default: []
      search_fields: [name, lastName]
      value_field: slug
      display_fields: [name]
      required: false
  slugs:
    slugAuto: &slugAuto
      name: slug
      default: 'EMPTY'
      widget: hidden
    slugNamed: &slugNamed
      name: slug
      default: '{{fields.name}}'
      widget: hidden
  text:
    description: &description
      name: description
      label: Long description
      widget: markdown
    title: &title
      name: title
      label: Title
      widget: string

collections:
  - name: funding
    label: Funding
    folder: content/funding
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: funding/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [dateStart, title, funder]
    fields:
      - *slugAuto
      - name: type
        label: Funding type
        widget: select
        options:
          - { label: Research funding, value: research }
          - { label: Teaching funding, value: teaching }
          - { label: Workshop funding, value: workshop }
      - <<: *title
        label: Award title
      - { name: name, label: Award number, widget: string }
      - { name: funder, label: Funding agency, widget: string }
      - <<: *nonNegativeInt
        name: amount
        label: Funding amount
      - *dateStart
      - *dateEnd
      - *thumbnail
      - <<: *link
        hint: Link to the official funding or project page (e.g., NIH RePORTER or CIFAR About the Project page)
        required: false
      - *featured
      - *projects
      - <<: *people
        name: investigators
        label: Primary investigators
      - <<: *nonNegativeInt
        name: receivedAmount
        label: Funding amount received
        required: false

  - name: people
    label: People
    label_singular: Person
    folder: content/people
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: people/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{name}}'
    sortable_fields: [name, lastName]
    fields:
      - *slugNamed
      - { name: name, label: Full Name, widget: string }
      - { name: lastName, label: Last Name (for sorting), widget: string }
      - <<: *image
        required: false

      - name: roles
        label: Roles
        label_singular: Role
        widget: list
        hint: Add all roles this person has had. Leave End Date blank if still active.
        default: []
        types:
          - label: CNS Member
            name: member
            widget: object
            summary: '{{fields.title}} - {{fields.displayOrder}}'
            fields:
              - { name: title, label: Title / Position, widget: string }
              - name: status
                label: Status
                widget: select
                required: true
                options:
                  - { label: Leadership, value: leadership }
                  - { label: Full-Time Staff, value: full-time }
                  - { label: Part-Time, value: part-time }
                  - { label: Contractor, value: contractor }
              - <<: *nonNegativeInt
                name: displayOrder
                label: Display Order
                required: false

              - { name: office, label: Office, widget: string, hint: Luddy Hall 40xx, required: false }
              - { name: phone, label: Office Phone Number, widget: string, required: false }
              - { name: fax, label: Office Fax Number, widget: string, required: false }
              - { name: email, label: Office Email, widget: string, hint: 'xx@iu.edu', required: false }

              - { name: education, label: Education, widget: markdown, required: false }
              - { name: background, label: Background, widget: markdown, required: false }
              - { name: interests, label: Interests, widget: markdown, required: false }

              - *dateStart
              - *dateEnd

          - label: CNS Student
            name: student
            widget: object
            summary: '{{fields.topic}} - {{fields.degree}}'
            fields:
              - { name: topic, label: Research Topic, widget: string }
              - { name: degree, label: Degree, widget: select, options: ['Ph.D.', 'Masters'] }
              - { name: department, label: Department, widget: string }
              - *dateStart
              - *dateEnd

          - label: Collaborator
            name: collaborator
            widget: object
            summary: '{{fields.project}}'
            fields:
              - { name: project, label: Project, widget: string }
              - *dateStart
              - *dateEnd

  - name: publication
    label: Publications
    folder: content/publications
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: publications/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, type, publisher]
    fields:
      - <<: *slugAuto
        csl_name: id
      - name: type
        csl_name: type
        label: Publication type
        widget: select
        options:
          - { label: Edited journal, value: periodical }
          - { label: Journal article, value: article-journal }
          - { label: Book, value: book }
          - { label: Book chapter, value: chapter }
          - { label: Conference proceeding, value: paper-conference }
          - { label: Patent, value: patent }
          - { label: Audio/Video, value: broadcast }
          - { label: Tech report, value: report }
          - { label: Preprint, value: manuscript }
          - { label: Thesis, value: thesis }
      - <<: *title
        csl_name: title
      - <<: *date
        csl_name: issued
      - { name: doi, csl_name: DOI, label: DOI, widget: string, required: false }
      - <<: *people
        name: authors
        csl_name: author
        label: Authors
      - <<: *people
        name: editors
        csl_name: editor
        label: Editors
      - *thumbnail
      - { name: pmid, csl_name: PMID, label: PMID, widget: string, required: false }
      - { name: publisher, csl_name: publisher, label: Publisher, widget: string, required: false }
      - { name: venue, csl_name: container-title, label: Publication Venue, widget: string, required: false }
      - { name: volume, csl_name: volume, label: Venue Volume, widget: string, required: false }
      - { name: issue, csl_name: issue, label: Venue Number, widget: string, required: false }
      - { name: pages, csl_name: page, label: Venue Pages, widget: string, required: false }
      - { name: chapter, csl_name: chapter-number, label: Venue Chapter, widget: string, required: false }
      # TODO: make sure to update csl handling in script
      # - name: links
      #   csl_name: URL
      #   label: Associated Media
      #   widget: list
      #   summary: '{{fields.media}}'
      #   field: { name: media, label: Media, widget: file }
      #   required: false
      - *featured
      - *projects
      - *media

  - name: news
    label: News
    folder: content/news
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: news/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, publisher]
    fields:
      - *slugAuto
      - *title
      - *date
      - <<: *link
        hint: Add a file or link to the news page
      - *thumbnail
      - *featured
      - *projects
      - <<: *description
        required: false
      - { name: publisher, label: Publisher, widget: string, required: false }
      - { name: reporter, label: Reporter, widget: string, required: false }
      - *media

  - name: visualization
    label: Visualizations
    folder: content/visualizations
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: visualizations/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, publisher]
    fields:
      - *slugAuto
      - *title
      - *date
      - <<: *link
        hint: Add a file or link to the visualization page
      - *thumbnail
      - <<: *people
        name: authors
        label: Authors
      - <<: *description
        required: false
      - *featured
      - *projects
      - *media

  - name: event
    label: Events
    folder: content/events
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: events/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [dateStart, title, type]
    fields:
      - *slugAuto
      - name: type
        label: Event type
        widget: select
        options:
          - { label: 24-hour events, value: '24hour' }
          - { label: Celebration, value: 'celebration' }
          - { label: Conference, value: 'conference' }
          - { label: Exhibit, value: 'exhibit' }
          - { label: Meeting, value: 'meeting' }
          - { label: Other, value: 'other' }
          - { label: Presentation, value: 'presentation' }
          - { label: Tutorial, value: 'tutorial' }
          - { label: Visit, value: 'visit' }
          - { label: Workshop, value: 'workshop' }
      - <<: *title
        label: Event type title
        hint: The title of the event type, i.e., the title of the event, presentation, workshop, etc.
      - <<: *link
        hint: This link embeds in the Event title
      - *dateStart
      - *dateEnd
      - *thumbnail

      - name: location
        label: Location
        widget: object
        summary: '{{fields.venue}}, {{fields.street}}, {{fields.city}}, {{fields.state}}, {{fields.country}}'
        collapsed: true
        required: false
        fields:
          - name: venue
            label: Venue name
            widget: string
            hint: The venue's name, e.g., 'Luddy School of Informatics, Computing, and Engineering' or if this event is remote, use 'Remote event'
            required: false
          - name: street
            label: Street
            widget: string
            hint: The street address from Google Maps and add a room number if applicable, e.g., '700 N Woodlawn Ave'
            required: false
          - name: city
            label: City
            widget: string
            hint: The city name, e.g., 'Bloomington'
            required: false
          - name: state
            label: State
            widget: string
            hint: The country's state, e.g., 'Indiana'
            required: false
          - name: postcode
            label: ZIP code or postal code
            widget: string
            hint: The city's ZIP code or international postal code, e.g., '47405'
            required: false
          - name: country
            label: Country
            widget: string
            hint: The country, e.g., 'USA', 'Germany', or 'Canada'
            required: false
          - name: raw
            widget: hidden
            hint: Old location entry in varying formats. DO NOT USE.
            required: false

      - <<: *people
        name: presenters
        label: Presenters
      - <<: *people
        name: instructors
        label: Instructors
      - <<: *people
        name: organizers
        label: Organizers
      - <<: *people
        name: attendees
        label: Attendees

      - *featured
      - *projects
      - *media

  - name: project
    label: Projects
    folder: content/projects
    path: '{{slug}}/data'
    format: yaml
    extension: yaml
    create: true
    identifier_field: slug
    preview_path: projects/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{name}}'
    sortable_fields: [name]
    fields:
      - *slugNamed
      - { name: name, label: Project name, widget: string }
      - <<: *description
        hint: Short description of the project for display on the website

