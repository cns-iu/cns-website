collections:
  - name: person
    label: People
    label_singular: Person
    folder: content/person
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    slug: "{{name}}"
    preview_path: person/{{slug}}
    media_folder: ''
    public_folder: ''
    sortable_fields: [lastName, name, displayOrder]
    fields:
      - { name: name, label: Full Name }
      - { name: lastName, label: Last Name (for sorting) }
      - name: displayOrder
        label: Display Order
        widget: number
        value_type: int
        min: 0
        required: false
      - { name: image, label: Image, widget: image, required: false }
      - { name: education, label: Education, widget: markdown, required: false }
      - { name: background, label: Background, widget: markdown, required: false }
      - { name: interests, label: Interests, widget: markdown, required: false }
      
      - { name: jobDescription, label: "Job Description" }
      - { name: dateStart, label: Start Date, widget: datetime, format: "YYYY-MM-DD" }
      - { name: dateEnd, label: End Date, widget: datetime, format: "YYYY-MM-DD" }
  
      - name: roles
        label: Roles
        label_singular: Role
        widget: list
        hint: "Add all roles this person has had. Leave End Date blank if still active."
        types:
          - label: "Faculty"
            name: "faculty"
            widget: "object"
            summary: "{{fields.title}} — {{fields.department}}"
            fields:
              - { label: "Title / Position", name: "title", widget: "string", required: false }
              - { label: "Department / Unit", name: "department", widget: "string", required: false }
              - { label: "Start Date", name: "dateStart", widget: "datetime", format: "YYYY-MM-DD", required: false }
              - { label: "End Date", name: "dateEnd", widget: "datetime", format: "YYYY-MM-DD", required: false, hint: "Leave blank if ongoing" }
              - { label: "Primary Role", name: "primary", widget: "boolean", required: false }

          - label: "Staff"
            name: "staff"
            widget: "object"
            summary: "{{fields.title}} — {{fields.department}}"
            fields:
              - { label: "Title / Position", name: "title", widget: "string", required: false }
              - { label: "Department / Unit", name: "department", widget: "string", required: false }
              - { label: "Start Date", name: "start_date", widget: "datetime", format: "YYYY-MM-DD", required: false }
              - { label: "End Date", name: "end_date", widget: "datetime", format: "YYYY-MM-DD", required: false, hint: "Leave blank if ongoing" }
              - { label: "Primary Role", name: "primary", widget: "boolean", required: false }

              # - { value: collaborator, label: Collaborator }
              # - { value: faculty, label: Faculty }
              # - { value: postdoc, label: Postdoc }
              # - { value: phd_student, label: "Ph.D. Student" }
              # - { value: staff, label: Staff }
              # - { value: visiting_artist, label: "Visiting Artist" }

