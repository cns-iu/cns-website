collections:
  - name: funding
    label: Funding
    folder: content/funding
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: funding/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [dateStart, title, funder]
    fields:
      - { name: slug, default: 'EMPTY', widget: hidden }
      - name: type
        label: Type
        widget: select
        options:
          - { label: Research, value: "research" }
          - { label: Teaching, value: "teaching" }
          - { label: Workshop, value: "workshop" }
      - { name: link, label: Link, widget: file, required: false, help_text: 'Link to the funding page.' }
      - { name: name, label: Name, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: funder, label: Funding Agency, widget: string }
      - { name: investigators, label: Primary Investigators, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: amount, label: Funding Amount, widget: number, value_type: int, min: 0 }
      - { name: receivedAmount, label: Funding Amount Received, widget: number, value_type: int, min: 0, required: false }
      - { name: mediaUrl, label: Media URL, widget: file, required: false, help_text: 'URL of the image, video, or document.' }
      - { name: dateStart, label: Start Date, widget: datetime, date_format: "YYYY-MM-DD" }
      - { name: dateEnd, label: End Date, widget: datetime, date_format: "YYYY-MM-DD", required: false }
      - { name: tags, label: Tags, widget: relation, collection: tags, multiple: true, search_fields: [name], value_field: slug, display_fields: [name], required: false }

  - name: people
    label: People
    label_singular: Person
    folder: content/people
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: people/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{name}}'
    sortable_fields: [name, lastName]
    fields:
      - { name: slug, default: '{{fields.name}}', widget: hidden }
      - { name: name, label: Full Name }
      - { name: lastName, label: Last Name (for sorting) }
      - { name: image, label: Image, widget: image, required: false }

      - name: roles
        label: Roles
        label_singular: Role
        widget: list
        hint: "Add all roles this person has had. Leave End Date blank if still active."
        types:
          - label: "CNS Member"
            name: "member"
            widget: "object"
            summary: "{{fields.title}} — {{fields.displayOrder}}"
            fields:
              - { name: title, label: "Title / Position" }
              - name: status
                label: Status
                widget: select
                required: true
                options:
                  - { label: Leadership, value: "leadership" }
                  - { label: Full-Time Staff, value: "full-time" }
                  - { label: Part-Time, value: "part-time" }
                  - { label: Contractor, value: "contractor" }
              - { name: displayOrder, label: Display Order, widget: number, value_type: int, min: 0, required: false }

              - { name: office, label: "Office", hint: "Luddy Hall 40xx", required: false }
              - { name: phone, label: "Office Phone Number", required: false }
              - { name: fax, label: "Office Fax Number", required: false }
              - { name: email, label: "Office Email", hint: "xx@iu.edu", required: false }

              - { name: education, label: Education, widget: markdown, required: false }
              - { name: background, label: Background, widget: markdown, required: false }
              - { name: interests, label: Interests, widget: markdown, required: false }
              
              - { name: dateStart, label: Start Date, widget: datetime, date_format: "YYYY-MM-DD" }
              - { name: dateEnd, label: End Date, widget: datetime, date_format: "YYYY-MM-DD", required: false }

          - label: "CNS Student"
            name: "student"
            widget: "object"
            summary: "{{fields.topic}} — {{fields.degree}}"
            fields:
              - { name: topic, label: "Research Topic" }
              - { name: degree, label: "Degree", widget: select, options: ["Ph.D.", "Masters"], required: true }
              - { name: department, label: Department }

              - { name: dateStart, label: Start Date, widget: datetime, date_format: "YYYY-MM-DD" }
              - { name: dateEnd, label: End Date, widget: datetime, date_format: "YYYY-MM-DD", required: false }

          - label: "Collaborator"
            name: "collaborator"
            widget: "object"
            summary: "{{fields.project}}"
            fields:
              - { name: project, label: "Project" }

              - { name: dateStart, label: Start Date, widget: datetime, date_format: "YYYY-MM-DD" }
              - { name: dateEnd, label: End Date, widget: datetime, date_format: "YYYY-MM-DD", required: false }

  - name: publications
    label: Publications
    folder: content/publications
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: publications/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, type, publisher]
    fields:
      - { name: slug, csl_name: id, default: 'EMPTY', widget: hidden }
      - name: type
        label: Type
        widget: select
        options:
          - { label: Edited journal, value: "periodical" }
          - { label: Journal article, value: "article-journal" }
          - { label: Book, value: "book" }
          - { label: Book chapter, value: "chapter" }
          - { label: Conference proceeding, value: "paper-conference" }
          - { label: Patent, value: "patent" }
          - { label: Audio/Video, value: "broadcast" }
          - { label: Tech report, value: "report" }
          - { label: Unrefereed, value: "manuscript" }
          - { label: Thesis, value: "thesis" }
      - { name: title, csl_name: title, label: Title, widget: string, required: false }
      - { name: authors, csl_name: author, label: Authors, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: editors, csl_name: editor, label: Editors, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: doi, csl_name: DOI, label: DOI, widget: string, required: false }
      - { name: pmid, csl_name: PMID, label: PMID, widget: string, required: false }
      - { name: date, csl_name: issued, label: Date, widget: datetime, date_format: "YYYY-MM-DD", required: true }
      - { name: publisher, csl_name: publisher, label: Publisher, widget: string, required: false }
      - { name: venue, csl_name: container-title, label: Publication Venue, widget: string, required: false }
      - { name: volume, csl_name: volume, label: Venue Volume, widget: string, required: false }
      - { name: issue, csl_name: issue, label: Venue Number, widget: string, required: false }
      - { name: pages, csl_name: page, label: Venue Pages, widget: string, required: false }
      - { name: chapter, csl_name: chapter-number, label: Venue Chapter, widget: string, required: false }
      - name: links
        csl_name: URL
        label: Associated Media
        widget: list
        summary: '{{fields.media}}'
        field: { name: media, label: Media, widget: file }
        required: false
      - { name: mediaUrl, label: Media URL, widget: file, required: false, help_text: 'URL of the image, video, or document.' }
      - { name: tags, label: Tags, widget: relation, collection: tags, multiple: true, search_fields: [name], value_field: slug, display_fields: [name], required: false }

  - name: news
    label: News
    folder: content/news
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: news/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, publisher]
    fields:
      - { name: slug, default: 'EMPTY', widget: hidden }
      - { name: link, label: Link, widget: file, required: false, help_text: 'Link to the news page.' }
      - { name: title, label: Title, widget: string, required: true }
      - { name: description, label: Description, widget: markdown, required: false }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", required: true }
      - name: mediaType
        label: Media Type
        widget: select
        required: false
        options:
          - { label: Image, value: image }
          - { label: Video, value: video }
          - { label: Document, value: document }
      - { name: mediaUrl, label: Media URL, widget: file, required: false, help_text: 'URL of the image, video, or document.' }
      - { name: caption, label: Caption, widget: text, required: false, help_text: 'The caption to be placed under the image.' }
      - { name: publisher, label: Publisher, widget: string, required: false }
      - { name: reporter, label: Reporter, widget: string, required: false }
      - { name: tags, label: Tags, widget: relation, collection: tags, multiple: true, search_fields: [name], value_field: slug, display_fields: [name], required: false }

  - name: visualizations
    label: Visualizations
    folder: content/visualizations
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: visualizations/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [date, title, publisher]
    fields:
      - { name: slug, default: 'EMPTY', widget: hidden }
      - { name: link, label: Link, widget: file, required: false, help_text: 'Link to the visualization page.' }
      - { name: title, label: Title, widget: string, required: true }
      - { name: authors, label: Authors, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: description, label: Description, widget: markdown, required: false }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", required: true }
      - name: mediaType
        label: Media Type
        widget: select
        required: false
        options:
          - { label: Image, value: image }
          - { label: Video, value: video }
          - { label: Document, value: document }
      - { name: mediaUrl, label: Media URL, widget: file, required: false, help_text: 'URL of the image, video, or document.' }
      - { name: tags, label: Tags, widget: relation, collection: tags, multiple: true, search_fields: [name], value_field: slug, display_fields: [name], required: false }

  - name: events
    label: Events
    folder: content/events
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: events/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{title}}'
    sortable_fields: [dateStart, title, type]
    fields:
      - { name: slug, csl_name: id, default: 'EMPTY', widget: hidden }
      - name: type
        label: Type
        widget: select
        options:
          - { label: Workshop, value: "workshop" }
          - { label: Conference, value: "conference" }
          - { label: Meeting, value: "meeting" }
          - { label: Visit, value: "visit" }
          - { label: Presentation, value: "presentation" }
          - { label: Tutorial, value: "tutorial" }
          - { label: Other, value: "other" }
      - { name: link, label: Link, widget: file, required: false, help_text: 'Link to the event page.' }
      - { name: title, label: Title, widget: string, required: false }
      - { name: description, label: Description, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - name: mediaType
        label: Media Type
        widget: select
        required: false
        options:
          - { label: Image, value: image }
          - { label: Video, value: video }
          - { label: Document, value: document }
      - { name: mediaUrl, label: Media URL, widget: file, required: false, help_text: 'URL of the image, video, or document.' }

      - { name: presenters, label: Presenters, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: instructors, label: Instructors, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: organizers, label: Organizers, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }
      - { name: attendees, label: Attendees, widget: relation, collection: people, multiple: true, search_fields: [name, lastName], value_field: slug, display_fields: [name], required: false }

      - { name: dateStart, label: Start Date, widget: datetime, date_format: "YYYY-MM-DD" }
      - { name: dateEnd, label: End Date, widget: datetime, date_format: "YYYY-MM-DD", required: false }
      - { name: tags, label: Tags, widget: relation, collection: tags, multiple: true, search_fields: [name], value_field: slug, display_fields: [name], required: false }

  - name: tags
    label: Tags
    folder: content/tags
    path: "{{slug}}/data"
    format: "yaml"
    extension: "yaml"
    create: true
    identifier_field: slug
    preview_path: tags/{{fields.slug}}/data.yaml
    media_folder: ''
    public_folder: ''
    summary: '{{name}}'
    sortable_fields: [name]
    fields:
      - { name: slug, default: '{{fields.name}}', widget: hidden }
      - { name: name, label: Short Tag, widget: string, required: false, help_text: 'Short description of the tag for display on the website' }
      - { name: description, label: Description, widget: string, required: false }

backend:
  name: github
  repo: cns-iu/cns-website
  branch: main

# Use DecapBridge PKCE auth (required)
# backend:
#   name: git-gateway
#   repo: cns-iu/cns-website
#   branch: main
#   auth_type: pkce
#   base_url: https://auth.decapbridge.com
#   auth_endpoint: /sites/d1c402cb-2903-41c5-afbf-133d5f34ebb2/pkce
#   auth_token_endpoint: /sites/d1c402cb-2903-41c5-afbf-133d5f34ebb2/token
#   gateway_url: https://gateway.decapbridge.com

#   # See who did what (optional)
#   commit_messages:
#     create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
#     update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
#     delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
#     uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
#     deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
#     openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
# auth:
#   email_claim: email
#   first_name_claim: first_name
#   last_name_claim: last_name
#   avatar_url_claim: avatar_url

# We'll switch to editorial workflow when we move closer to production (maybe)
# publish_mode: editorial_workflow

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

i18n:
  structure: single_file
  locales: [en, es, zh, fr, pt, de, pl]
  default_locale: en

media_folder: content/images/uploads
public_folder: content/images/uploads
site_url: https://github.com/cns-iu/cns-website/tree/main/content
display_url: https://cns-iu.github.io/cns-website
logo_url: https://cns.iu.edu/images/global/cns_logo.png
show_preview_links: true

# Set local_backend to true when testing locally
## See https://www.netlifycms.org/docs/beta-features/#working-with-a-local-git-repository
## Basically run `npx decap-server` and launch the angular site
local_backend: false
