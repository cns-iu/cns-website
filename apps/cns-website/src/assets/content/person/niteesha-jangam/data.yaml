    background: "I am Niteesha Jangam, currently working as a Data Science Research Assistant at Indiana University's Cyberinfrastructure for Network Science Center. My primary focus is on understanding advanced data visualization techniques and virtual reality (VR) for biological data research. I hold a master’s in data science (Technology and Managerial Track) and a bachelor’s in Information Technology, which allows me to combine technical expertise with managerial skills to tackle complex projects. My current work includes research and development on immersive VR platforms for the Human Reference Atlas (HRA), building large-scale data models. I am passionate about using innovative technology to enhance scientific understanding and communication. Through my research, I aim to bridge the gap between data science and biological sciences, making data more accessible and insightful for various audiences. I was honored to receive an Honorable Mention Award at the IU Research Showcase for my contributions to the Strategic and Infrastructure Development project. Previously, as a Process Associate at Google, I focused on enhancing user privacy and data security. I served as Managing Director at Vortex Crew Technologies, where I led business operations and strategic planning. I also worked as a Talent Strategy Consultant at Allegis Global Solutions, optimizing recruitment processes with data analytics and managing 7 key client accounts.\r\n \r\n"
