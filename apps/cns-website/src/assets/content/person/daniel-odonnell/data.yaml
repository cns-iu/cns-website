    background: "My background in higher education has so far focused in the areas of student programming and development. My long term career interests in higher education are in higher education finance. </br></br>\r\nI joined CNS in February 2016 as their first ever project manager. My responsibilities include tracking milestones and timelines of project proposals, post-award management for all grants and contacts, representing the Center to major stakeholders such as the NSF and NIH, and serving as the fiscal manager for the Center’s operations. My goal is to bring more efficiency to the Center for the betterment of its staff, funding agencies, and clients through the implementation of a “Development Lifecycle” which will allow for improved project management, and delivery of even higher quality work. "
