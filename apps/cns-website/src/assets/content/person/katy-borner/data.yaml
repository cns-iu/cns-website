    education: >-
      Katy holds a MS in Electrical Engineering from the University of
      Technology in Leipzig, 1991 and a Ph.D. in Computer Science from the
      University of Kaiserslautern, 1997. 
    background: >-
      Katy Börner is the Victor H. Yngve Distinguished Professor of Engineering
      and Information Science in the Department of Intelligent Systems
      Engineering, School of Informatics and Computing, Core Faculty of
      Cognitive Science, and Founding Director of the Cyberinfrastructure for
      Network Science Center at Indiana University in Bloomington, IN. She is a
      Visiting Professor at the Royal Netherlands Academy of Arts and Sciences
      (KNAW) in The Netherlands and a curator of the international Places &
      Spaces: Mapping Science exhibit. She was elected as an American
      Association for the Advancement of Science (AAAS) Fellow in 2012 and as an
      Alexander von Humboldt Fellow in 2017.
